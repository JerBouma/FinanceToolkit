  - "should"

# ──────────────────────────────────────────────────────────────────────────────
# Category descriptions shown by the list_categories utility tool
# Keys must match the index_category (or module_name fallback) used when
# registering each router group below.
# ──────────────────────────────────────────────────────────────────────────────
category_descriptions:
  ratios:                  "Pre-computed financial ratios (PE, EPS, ROE, margins, liquidity, valuation). Use INSTEAD of raw financial statements."
  performance:             "Risk-adjusted returns (Sharpe, Sortino, alpha, beta, CAPM, Treynor, M2, tracking error, information ratio, Fama-French, period/cumulative Returns and Excess Returns). Most metrics support rolling= for a rolling-window value instead of one per period. No need to fetch price data first."
  risk:                    "Risk metrics (VaR incl. EVT/GPD tail fitting, CVaR, EVaR, GARCH, max drawdown, drawdown duration/recovery time, CDaR, tail ratio, skewness, kurtosis, downside deviation, Variance, Volatility, Excess Volatility). Most metrics support rolling= for a rolling-window value instead of one per period. No need to fetch price data first."
  econometrics:            "Statistical/econometric tests on price or return series (unit root: ADF/KPSS/Phillips-Perron/Zivot-Andrews, cointegration: Engle-Granger/Johansen, Granger causality, ARCH-LM, Jarque-Bera, Ljung-Box, Variance Ratio, CUSUM, Diebold-Mariano forecast comparison). Use for pairs-trading/spread-modeling foundations or diagnosing return-series properties. No need to fetch price data first."
  models:                  "Financial models (DCF/intrinsic value, WACC, DuPont, Altman Z, Piotroski). Pre-computed."
  technicals:              "Technical indicators (RSI, MACD, Bollinger Bands, moving averages). Applied to price data automatically."
  options:                 "Option pricing and Greeks (Black-Scholes, binomial, delta, gamma, theta, vega, implied vol)."
  government_economy:      "Government fiscal metrics by country (debt, deficit, expenditure, revenue, tax). Use countries= param. Supports rolling= (moving-average) and trailing= (trailing-period sum)."
  general_economy:         "Macroeconomic indicators by country (GDP, real GDP, CPI, PPI, inflation, trade, investment, consumption, confidence, money supply, output gap, real interest rate, crisis indicators, commodity forward curves). Use countries= param (commodity forward curve uses commodity= instead). Supports rolling= (moving-average) and trailing= (trailing-period sum)."
  environment:             "Environmental and ESG data. Carbon footprint and renewable energy use countries= (supports rolling=/trailing=); ESG scores use tickers=."
  jobs_and_society:        "Labour and social metrics by country (unemployment, population, poverty, income inequality). Use countries= param. Supports rolling= (moving-average) and trailing= (trailing-period sum)."
  interest_rates:          "Interest rate data — central bank rates, government/corporate bond yields, EURIBOR, short/long-term rates, U.S. Treasury par yield curve, real (TIPS) yield curve, breakeven inflation. Use countries= param. Economics-sourced rates support rolling=/trailing=."
  fixed_income_valuations: "Bond and derivative valuation calculations (duration, present value, yield-to-maturity, derivative pricing, par yield, forward rate, key rate duration, yield curve spread, Z-spread, bond-equivalent yield)."
  discovery:               "Market discovery (stock/ETF/crypto lists, screener, gainers/losers, sector performance). No tickers needed."
  toolkit:                 "Raw data (historical prices, financial statements, company profile, quotes, market risk premium, Commitment of Traders). Use ratios/performance/risk tools for computed metrics."

# ──────────────────────────────────────────────────────────────────────────────
# Router group specifications
# Each entry becomes one MCP master tool.

tool_groups:
  # ── Ratios (5 sub-groups) ────────────────────────────────────────────────
  - tool_name:      "efficiency"
    display_name:   "Efficiency Ratios"
    description:    "Pre-computed efficiency ratios (asset turnover, inventory turnover, days sales outstanding, days payable outstanding, cash conversion cycle). Requires tickers='AAPL' — use comma-separated values for multiple tickers. Use instead of raw financial statements. Supports quarterly=true and start_date/end_date."
    module_name:    "ratios"
    category:       "ticker"
    collect_method: "collect_efficiency_ratios"

  - tool_name:      "liquidity"
    display_name:   "Liquidity Ratios"
    description:    "Pre-computed liquidity ratios (current ratio, quick ratio, cash ratio, working capital). Requires tickers='AAPL' — use comma-separated values for multiple tickers. Use instead of raw financial statements. Supports quarterly=true and start_date/end_date."
    module_name:    "ratios"
    category:       "ticker"
    collect_method: "collect_liquidity_ratios"

  - tool_name:      "profitability"
    display_name:   "Profitability Ratios"
    description:    "Pre-computed profitability ratios (gross margin, operating margin, net margin, ROE, ROA, ROIC, ROCE). Requires tickers='AAPL' — use comma-separated values for multiple tickers. Use instead of raw financial statements. Supports quarterly=true and start_date/end_date."
    module_name:    "ratios"
    category:       "ticker"
    # Interest/Tax Burden are DuPont components that collect_profitability_ratios does not call,
    # but each is a standalone metric, so the full list is given explicitly here.
    # method_override replaces the discovered list wholesale, so anything added to
    # that collect_* method in future must be added here too.
    method_override:
      - "get_gross_margin"
      - "get_operating_margin"
      - "get_net_profit_margin"
      - "get_ebitda_margin"
      - "get_free_cash_flow_margin"
      - "get_interest_coverage_ratio"
      - "get_income_before_tax_profit_margin"
      - "get_effective_tax_rate"
      - "get_return_on_assets"
      - "get_cash_return_on_assets"
      - "get_return_on_equity"
      - "get_return_on_invested_capital"
      - "get_return_on_capital_employed"
      - "get_return_on_tangible_assets"
      - "get_income_quality_ratio"
      - "get_net_income_per_ebt"
      - "get_free_cash_flow_operating_cash_flow_ratio"
      - "get_EBT_to_EBIT"
      - "get_EBIT_to_revenue"
      - "get_cash_tax_rate"
      - "get_tax_rate_divergence"
      - "get_interest_burden_ratio"
      - "get_tax_burden_ratio"

  - tool_name:      "solvency"
    display_name:   "Solvency Ratios"
    description:    "Pre-computed solvency ratios (debt-to-equity, interest coverage, debt-to-assets, net debt to EBITDA). Requires tickers='AAPL' — use comma-separated values for multiple tickers. Use instead of raw financial statements. Supports quarterly=true and start_date/end_date."
    module_name:    "ratios"
    category:       "ticker"
    collect_method: "collect_solvency_ratios"

  - tool_name:      "valuation"
    display_name:   "Valuation Ratios"
    description:    "Pre-computed valuation ratios (P/E, EPS, EV/EBITDA, EV/EBIT, P/B, P/S, PEG, dividend yield, FCF yield, market cap, forward P/E, forward PEG). Requires tickers='AAPL' — use comma-separated values for multiple tickers. Use instead of raw financial statements. Supports quarterly=true and start_date/end_date. get_forward_price_earnings_ratio and get_forward_price_earnings_growth_ratio additionally require a Premium FMP subscription and are fetched on first use only."
    module_name:    "ratios"
    category:       "ticker"
    collect_method: "collect_valuation_ratios"
    # get_forward_price_earnings_ratio/get_forward_price_earnings_growth_ratio are deliberately
    # NOT called from collect_valuation_ratios (that would force a Premium-only analyst-estimates
    # fetch attempt on every bulk valuation-ratios call, even for free-tier users), so the
    # collect_method source-scan above can't discover them. Listed explicitly here instead —
    # method_override replaces the discovered list wholesale, so if new valuation ratios are
    # added to collect_valuation_ratios in the future, add them here too.
    method_override:
      - "get_earnings_per_share"
      - "get_revenue_per_share"
      - "get_price_to_earnings_ratio"
      - "get_price_to_earnings_growth_ratio"
      - "get_forward_price_earnings_ratio"
      - "get_forward_price_earnings_growth_ratio"
      - "get_book_value_per_share"
      - "get_price_to_book_ratio"
      - "get_interest_debt_per_share"
      - "get_capex_per_share"
      - "get_earnings_yield"
      - "get_dividend_payout_ratio"
      - "get_dividend_yield"
      - "get_weighted_dividend_yield"
      - "get_price_to_cash_flow_ratio"
      - "get_price_to_free_cash_flow_ratio"
      - "get_market_cap"
      - "get_enterprise_value"
      - "get_ev_to_sales_ratio"
      - "get_ev_to_ebit"
      - "get_ev_to_ebitda_ratio"
      - "get_ev_to_operating_cashflow_ratio"
      - "get_tangible_asset_value"
      - "get_net_current_asset_value"
      - "get_ev_to_free_cash_flow_ratio"
      - "get_buyback_yield"
      - "get_shareholder_yield"
      - "get_sbc_adjusted_free_cash_flow"
      - "get_price_to_sales_ratio"
      - "get_reinvestment_rate"

  # ── Technicals (4 sub-groups) ────────────────────────────────────────────
  - tool_name:      "breadth"
    display_name:   "Breadth Indicators"
    description:    "Market breadth technical indicators (McClellan Oscillator, OBV, Advance/Decline Line, Chaikin). Applied to price data automatically — no need to fetch prices first. Requires tickers='AAPL' — use comma-separated values for multiple tickers."
    module_name:    "technicals"
    category:       "ticker"
    collect_method: "collect_breadth_indicators"

  - tool_name:      "momentum"
    display_name:   "Momentum Indicators"
    description:    "Momentum technical indicators (RSI, MACD, Stochastic Oscillator, Williams %R, Aroon). Applied to price data automatically — no need to fetch prices first. Requires tickers='AAPL' — use comma-separated values for multiple tickers."
    module_name:    "technicals"
    category:       "ticker"
    collect_method: "collect_momentum_indicators"

  - tool_name:      "overlap"
    display_name:   "Overlap Indicators"
    description:    "Overlap technical indicators (SMA, EMA, Bollinger Bands, Keltner Channels). Applied to price data automatically — no need to fetch prices first. Requires tickers='AAPL' — use comma-separated values for multiple tickers."
    module_name:    "technicals"
    category:       "ticker"
    # Support/Resistance returns one row per level so collect_overlap_indicators cannot include it,
    # but each is a standalone metric, so the full list is given explicitly here.
    # method_override replaces the discovered list wholesale, so anything added to
    # that collect_* method in future must be added here too.
    method_override:
      - "get_moving_average"
      - "get_exponential_moving_average"
      - "get_double_exponential_moving_average"
      - "get_trix"
      - "get_triangular_moving_average"
      - "get_weighted_moving_average"
      - "get_hull_moving_average"
      - "get_kaufman_adaptive_moving_average"
      - "get_volume_weighted_average_price"
      - "get_parabolic_sar"
      - "get_pivot_points"
      - "get_fibonacci_retracement_levels"
      - "get_support_resistance_levels"

  - tool_name:      "volatility"
    display_name:   "Volatility Indicators"
    description:    "Volatility technical indicators (ATR, True Range). Applied to price data automatically — no need to fetch prices first. Requires tickers='AAPL' — use comma-separated values for multiple tickers."
    module_name:    "technicals"
    category:       "ticker"
    # The Volatility Cone is indexed by rolling window so collect_volatility_indicators cannot include it,
    # but each is a standalone metric, so the full list is given explicitly here.
    # method_override replaces the discovered list wholesale, so anything added to
    # that collect_* method in future must be added here too.
    method_override:
      - "get_bollinger_bands"
      - "get_true_range"
      - "get_average_true_range"
      - "get_supertrend"
      - "get_keltner_channels"
      - "get_donchian_channels"
      - "get_volatility_cone"

  # ── Single-module ticker tools ───────────────────────────────────────────
  - tool_name:    "models"
    display_name: "Financial Models"
    description:  "Pre-computed financial models (WACC, DuPont analysis, Extended DuPont analysis, Enterprise value breakdown, intrinsic value/DCF, Gordon Growth Model, Altman Z-Score, Piotroski F-Score, Beneish M-Score, Economic Value Added (EVA), Present Value of Growth Opportunities, Sustainable Growth Rate, Internal Growth Rate, Graham Number). Requires tickers='AAPL' — use comma-separated values for multiple tickers. Supports quarterly=true and start_date/end_date."
    module_name:  "models"
    category:     "ticker"

  - tool_name:    "performance"
    display_name: "Performance Metrics"
    description:  "Pre-computed risk-adjusted performance metrics (Sharpe ratio, Sortino ratio, Alpha, Jensen's Alpha, Beta, CAPM, Treynor ratio, M2 ratio, Tracking Error, Information Ratio, Fama-French factors, period Returns, Excess Returns — Returns/Excess Returns support cumulative=true for a compounded growth index rebased to 1). Beta, CAPM, Alpha, Jensen's Alpha, Treynor, Sortino, M2, Tracking Error and Information Ratio support rolling=N for a rolling N-period value spanning the full history instead of one value per period (e.g. period='monthly', rolling=6 for a rolling 6-month figure). Requires tickers='AAPL' — use comma-separated values for multiple tickers. Does NOT support period='daily'; use weekly, monthly, quarterly, or yearly instead."
    module_name:  "performance"
    category:     "ticker"

  - tool_name:    "risk"
    display_name: "Risk Metrics"
    description:  "Pre-computed risk metrics (VaR incl. historic/gaussian/cf/studentt/evt distributions, CVaR, EVaR, GARCH volatility, max drawdown, drawdown duration, drawdown recovery time, Conditional Drawdown at Risk (CDaR), Tail Ratio, skewness, kurtosis, downside deviation, Variance, Volatility, Excess Volatility). VaR, CVaR, skewness, kurtosis, CDaR, Tail Ratio, downside deviation, Variance, Volatility and Excess Volatility support rolling=N for a rolling N-period value spanning the full history instead of one value per period (e.g. period='monthly', rolling=6 for a rolling 6-month figure). Requires tickers='AAPL' — use comma-separated values for multiple tickers. Does NOT support period='daily'; use weekly, monthly, quarterly, or yearly instead."
    module_name:  "risk"
    category:     "ticker"

  - tool_name:    "econometrics"
    display_name: "Econometrics Tests"
    description:  "Statistical/econometric tests on price or return series (unit root: ADF/KPSS/Phillips-Perron/Zivot-Andrews, cointegration: Engle-Granger/Johansen, Granger causality, ARCH-LM, Jarque-Bera, Ljung-Box, Variance Ratio, CUSUM, Diebold-Mariano forecast comparison). Use for pairs-trading/spread-modeling foundations or diagnosing return-series properties. Requires tickers='AAPL' — use comma-separated values for multiple tickers."
    module_name:  "econometrics"
    category:     "ticker"

  - tool_name:    "options"
    display_name: "Options"
    description:  "Option pricing and Greeks (Black-Scholes model, binomial tree, delta, gamma, theta, vega, rho, implied volatility). Requires tickers='AAPL' — use comma-separated values for multiple tickers."
    module_name:  "options"
    category:     "ticker"

  # ── Economics: Government & Fiscal ──────────────────────────────────────
  # All government debt, deficit, expenditure, revenue, tax, and trust metrics.
  - tool_name:       "government"
    display_name:    "Government & Fiscal Metrics"
    description:     "Government fiscal metrics by country (debt, deficit, expenditure, revenue, tax revenue, trust in government). Requires countries='United States' — use comma-separated values for multiple countries. Do NOT use tickers= for this tool. Supports start_date/end_date and quarterly=true. Supports rolling=N (moving-average smoothing) and trailing=N (trailing N-period sum, e.g. a trailing-4-quarter sum) on the raw series."
    module_name:     "economics"
    category:        "standalone"
    index_category:  "government_economy"
    method_override:
      - "get_government_debt"
      - "get_government_debt_to_gdp_ratio"
      - "get_government_deficit"
      - "get_government_deficit_to_gdp_ratio"
      - "get_government_expenditure"
      - "get_government_expenditure_to_gdp_ratio"
      - "get_government_revenue"
      - "get_government_revenue_to_gdp_ratio"
      - "get_government_tax_revenue"
      - "get_government_tax_revenue_to_gdp_ratio"
      - "get_trust_in_government"

  # ── Economics: General Macroeconomic Indicators ──────────────────────────
  # GDP, CPI, inflation, trade balances, investment, consumption,
  # confidence indices, house/rent prices, exchange rates, share prices.
  - tool_name:       "macroeconomics"
    display_name:    "General Economy"
    description:     "Macroeconomic indicators by country (GDP, real GDP, CPI, PPI, inflation rate, trade balance, imports, exports, investment, consumption, business/consumer confidence, house prices, rent prices, exchange rates, real effective exchange rate, money supply, household savings rate, household debt-to-income ratio, output gap, real interest rate, misery index, banking/currency/sovereign debt crisis indicators, commercial real estate prices, commodity forward curves). Requires countries='United States' — use comma-separated values for multiple countries. Do NOT use tickers= for this tool. Supports start_date/end_date and quarterly=true. Supports rolling=N (moving-average smoothing) and trailing=N (trailing N-period sum, e.g. a trailing-4-quarter sum) on the raw series. get_consumer_price_index accepts oecd_source=true for monthly/quarterly OECD data instead of the default annual GMDB source. get_commodity_forward_curve requires a commodity= argument instead of countries= (e.g. 'Crude Oil', 'Gold') and returns dated futures contracts, not a country series. Also includes six US-only, FRED-backed indicators (get_retail_sales, get_industrial_production_index, get_housing_starts, get_real_personal_income, get_recession_indicator, get_commercial_real_estate_prices) — these require a free FRED API key (optional; get one at https://fred.stlouisfed.org/docs/api/api_key.html) and only return a 'United States' column regardless of the countries= argument."
    module_name:     "economics"
    category:        "standalone"
    index_category:  "general_economy"
    method_override:
      - "get_business_confidence_index"
      - "get_composite_leading_indicator"
