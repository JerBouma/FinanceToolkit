  # ── Economics: General Macroeconomic Indicators ──────────────────────────
  # GDP, CPI, inflation, trade balances, investment, consumption,
  # confidence indices, house/rent prices, exchange rates, share prices.
  - tool_name:       "macroeconomics"
    display_name:    "General Economy"
    description:     "Macroeconomic data by country: GDP and its growth, consumption, investment, trade, CPI and inflation (with core and components), producer, export and import prices, purchasing power, confidence, house, rent and commercial real estate prices, exchange rates (each currency per US dollar; for a pair such as EURUSD use market_data), money supply, savings and household debt, output gap, real interest rates, crisis indicators, credit gaps and debt service, international investment position, reserves, capacity utilization, commodity prices, futures curves and term structure, chokepoint transits, implied volatility indices, regulators' stress test scenarios and a pension scenario set, long-run asset returns, the Bank of England's millennium of data, US-only series (industrial production, recessions, retail sales, housing starts, real personal income) and the economic calendar (High impact releases from 23 days back to 7 ahead unless impact=, events= or start_date/end_date say otherwise; keep it to a few weeks). Requires countries='United States,Germany'; never tickers=. Each indicator comes at the highest frequency it is published at unless period= says otherwise. Every rate and ratio is a decimal fraction, not a percentage: an inflation rate of 4.1% comes back as 0.041; multiply by 100 to present percentages. rolling=N smooths and trailing=N sums the series. Several need no countries (commodity prices and futures, chokepoint transits, Shiller data, supply chain pressure, implied volatility). get_long_run_asset_returns requires accept_licence=true (non-commercial licence); get_millennium_of_macroeconomic_data needs an early start_date (e.g. '1700-01-01'); the first call of get_scenario_set takes one to two minutes. China's producer prices: get_economic_calendar with events='Producer Price'. search_metrics with an indicator's name gives its parameters, options and defaults."
