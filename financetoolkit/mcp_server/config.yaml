# ──────────────────────────────────────────────────────────────────────────────
# Category descriptions shown by the list_categories utility tool
# Keys must match the index_category (or module_name fallback) used when
# registering each router group below.
# ──────────────────────────────────────────────────────────────────────────────
category_descriptions:
  ratios:                  "Pre-computed financial ratios (PE, EPS, ROE, margins, liquidity, valuation). Use INSTEAD of raw financial statements."
  performance:             "Risk-adjusted returns (Sharpe, Sortino, upside potential, safety-first, pain ratio, alpha, beta, beta-implied return and residual, CAPM, Treynor, M2, tracking error, information ratio, Fama-French, Morningstar risk-adjusted return and risk, period/cumulative/log Returns and Excess Returns, trailing and calendar returns, Serenity Index, return over any risk measure (CVaR, CDaR, MAD, ...), Sharpe ratio difference test, probabilistic momentum, bootstrapped statistics and forecast cone, probability of backtest overfitting, smoothing index, Kelly criterion, trade statistics such as profit factor and payoff ratio, capture ratios, bull and bear beta, R-squared, systematic and specific risk, probability of outperformance). Most metrics support rolling= for a rolling-window value instead of one per period. No need to fetch price data first."
  risk:                    "Risk metrics (VaR incl. EVT/GPD tail fitting and kernel, CVaR incl. weighted (spectral) CVaR, EVaR incl. historical, entropic risk measure, higher moment coherent risk (coherent second moment), expected quadratic shortfall, GARCH family incl. GJR, APARCH, IGARCH, component GARCH with Student-t and skewed-t innovations, news impact curve and simulation (the forecast is a variance, not a volatility), max drawdown (also rolling and uncompounded), drawdown duration/recovery time, drawdown series, table and statistics, average drawdown, DaR, CDaR, EDaR, conditional expected drawdown, ulcer and pain index, tail ratio, skewness, kurtosis, downside deviation and semi-deviation, upside deviation, volatility skewness, partial and central moments, L-moments, Gini mean difference, tail Gini, range measures, worst realization, skewness-kurtosis ratio, Variance, Volatility, Excess Volatility, Hurst exponent (generalized, rescaled range, DFA), fractal dimension (Higuchi, Katz, Petrosian), correlation dimension, Lyapunov exponent). Most metrics support rolling= for a rolling-window value instead of one per period. No need to fetch price data first."
  econometrics:            "Statistical and econometric analysis of price or return series, or of any other indicator (series=): how unusual the latest value is (highest or lowest since) and how long it has been positive or negative (streaks), the change over the same months every year, of a series or the spread of two, unit root, cointegration and causality tests, VAR and ARIMA forecasts, regressions (OLS, quantile, IV, panel), causal designs (difference-in-differences, event study, synthetic control), Markov regime switching, structural breaks, time-varying beta, DCC-GARCH correlations, pairs trading, diagnostics and statistics over the whole range or a rolling window (linear regression, correlation, median, percentile, z-score, entropy), entropy and complexity (sample, approximate, permutation, spectral, SVD, Shannon, Lempel-Ziv, Kontoyiannis and share entropy, Lempel-Ziv complexity, Hjorth parameters). No need to fetch price data first."
  portfolio:               "Portfolio construction: optimal weights (minimum variance, maximum Sharpe, mean-variance, risk parity, HRP, HERC, NCO, mean-risk incl. minimum CVaR, CVaR ratio and minimum drawdown, maximum Omega, Black-Litterman, maximum diversification, minimum tracking error, growth optimal Kelly), efficient frontier, walk-forward backtest against 1/N, risk contributions (volatility, expected shortfall, VaR, EVaR, semideviation, mean absolute deviation, Gini mean difference, kurtosis, drawdowns), factor risk contributions, risk metrics of given weights, diversification metrics, whole-share discrete allocation, historical stress tests, look-through exposure of ETFs, Brinson and factor attribution and return contributions, and the estimates behind them (shrunk and compounded expected returns, shrunk, Gerber, denoised, detoned and factor covariances, factor loadings, entropy pooling of views, codependence and distance matrices, FTCA clusters, coskewness and cokurtosis, bootstrapped uncertainty)."
  portfolio_performance:   "A portfolio you hold, from its transactions, holdings, weights or a classic preset: positions, value and returns over time, the return since purchase at the end of each period, profit and loss per trade, the money-weighted return, return contributions, turnover and gross leverage, the trade list and its statistics (win rate, profit factor, expectancy, SQN) and the holding periods, next to a benchmark."
  models:                  "Financial models (DCF/intrinsic value, WACC, DuPont, Altman Z, Piotroski). Pre-computed."
  technicals:              "Technical indicators (RSI, MACD, Bollinger Bands, moving averages), candlestick patterns and trading signals. Applied to price data automatically."
  options:                 "Option pricing and Greeks (Black-Scholes, binomial, delta, gamma, theta, vega, implied vol)."
  etf:                     "ETF analysis (holdings, information, sector and country weightings, profile and premium/discount to NAV, tracking difference and error, concentration, overlap and active share between funds, look-through valuation of the holdings, liquidity, contribution of holdings and sectors to the return, return without some holdings or sectors)."
  government:              "Government fiscal metrics by country (debt, deficit, expenditure, revenue, tax, interest expenditure, expenditure by function such as defence, health and education). Use countries= param. Supports rolling= (moving-average) and trailing= (trailing-period sum)."
  macroeconomics:          "Macroeconomic indicators by country (GDP, real GDP, CPI, PPI, export and import prices, inflation, trade, investment, consumption, confidence, money supply, output gap, net international investment position, real interest rate, crisis indicators, commodity forward curves and term structure). Use countries= param (the commodity forward curve and term structure take commodity= instead, every commodity when left out). Supports rolling= (moving-average) and trailing= (trailing-period sum)."
  environment:             "Environmental and ESG data. Carbon footprint and renewable energy use countries= (supports rolling=/trailing=); ESG scores use tickers=."
  jobs:                    "Labour and social metrics by country (unemployment, population, poverty, income inequality). Use countries= param. Supports rolling= (moving-average) and trailing= (trailing-period sum)."
  rates:                   "Interest rate data — central bank rates, government/corporate bond yields, EURIBOR, short/long-term rates, U.S. Treasury par yield curve, real (TIPS) yield curve, breakeven inflation, zero-coupon curves, Nelson-Siegel-Svensson fits, bond carry and roll-down, yield curve principal components, Vasicek/CIR/Hull-White short-rate models, U.S. Treasury auction results. Use countries= param. Economics-sourced rates support rolling=/trailing=."
  fixed_income:            "Bond calculations on real bonds, from market prices (statistics, present value on the Treasury zero curve, duration, yield to maturity, Z-spread, key rate duration, Taylor price change next to the realised price change between two dates, Treasury bill bond-equivalent yields), rates from the market curves (forward rates, par yields, yield curve spreads, breakeven inflation, inflation swap rates and the forward CPI), swap rates, FRA rates, asset swap and I-spreads of corporate bonds, FX forward rates, default probabilities implied by credit spreads, prices of every Treasury and thousands of corporate bonds, Treasury FRN discount margins, TIPS index ratios and breakevens, Treasury forward prices and futures basis with the cheapest to deliver, and mortgage payments, affordability and amortization at the US mortgage rate."
  discovery:               "Market discovery (lists of stocks, ETFs, indices, currencies and cryptocurrencies, stock screener, gainers and losers, sector and industry performance, Damodaran industry averages, earnings, IPO and split calendars, 8-K filings, insider trades, news, index constituents past and present). No tickers needed."
  market_data:             "Raw data (historical prices, financial statements, company profile, quotes, analyst estimates, price targets and recommendations, earnings calendar and call transcripts, insider statistics, institutional (13F) ownership, market risk premium, Commitment of Traders). Futures take Yahoo Finance tickers (BZ=F Brent, CL=F WTI, NG=F natural gas, GC=F gold, TTF=F Dutch gas): get_historical_data has the daily continuous front month of each (where Yahoo Finance has no daily bars, as for TTF=F, the days of the last two years are built from its hourly bars, closing at the last trade rather than the settlement), get_quote and get_intraday_data the commodities FinancialModelingPrep carries (not TTF=F). Use ratios/performance/risk tools for computed metrics."

# ──────────────────────────────────────────────────────────────────────────────
# Router group specifications
# Each entry becomes one MCP master tool.

tool_groups:
  # ── Ratios (5 sub-groups) ────────────────────────────────────────────────
  - tool_name:      "efficiency"
    display_name:   "Efficiency Ratios"
    description:    "Efficiency ratios from the financial statements: asset, fixed asset, inventory, receivables, payables and working capital turnover, days of inventory, sales and payables outstanding, operating and cash conversion cycle, cost ratios (SG&A, R&D, selling and marketing, G&A, stock-based compensation, operating ratio), capex intensity and coverage, net capital expenditure, intangibles to total assets, revenue and net income per employee, and the investment anomalies asset growth and net operating assets. Requires tickers='AAPL,MSFT'; quarterly=true for quarterly data and start_date/end_date for the range. basket=true adds a 'Total': the tickers as one company, its ratios calculated on the summed statements (per-share ratios stay empty). Factor analysis of these ratios: the valuation tool with indicator='get_factor_analysis' and metrics='efficiency'. search_metrics with an indicator's name gives its parameters, options and defaults."
    module_name:    "ratios"
    category:       "ticker"
    basket:         true
    # Listed explicitly, as the figures per employee are not part of collect_efficiency_ratios
    # (they need the employee counts, a separate download); anything added to it must be
    # added here too.
    method_override:
      - "get_days_of_inventory_outstanding"
      - "get_days_of_sales_outstanding"
      - "get_operating_cycle"
      - "get_days_of_accounts_payable_outstanding"
      - "get_cash_conversion_cycle"
      - "get_cash_conversion_efficiency"
      - "get_receivables_turnover"
      - "get_inventory_turnover_ratio"
      - "get_accounts_payables_turnover_ratio"
      - "get_sga_to_revenue_ratio"
      - "get_fixed_asset_turnover"
      - "get_asset_turnover_ratio"
      - "get_operating_ratio"
      - "get_research_and_development_ratio"
