  # ── Fixed Income: Bond Calculations ──────────────────────────────────────
  # Bond measures on real bonds (FedInvest Treasuries, bond ETF holdings) and
  # rates from the market curves.
  - tool_name:       "fixed_income"
    display_name:    "Bond Calculations"
    description:     "Bond calculations on real bonds and market curves; nothing needs to be typed in. The bond calculations (collect_bond_statistics for all measures at once, get_present_value, get_duration, get_yield_to_maturity, get_z_spread, get_key_rate_duration, get_taylor_price_change) return one row per bond with its issuer, coupon, maturity and market price. Without arguments they use the benchmark US Treasuries (the note or bond maturing closest to 2, 3, 5, 7, 10, 20 and 30 years out) from the Treasury's FedInvest prices, without an API key. Select bonds with bonds= (CUSIPs or ISINs; Treasury CUSIPs start with 912), issuer= (text in the issuer name, e.g. 'APPLE INC', read from bond ETF holdings, which needs a FinancialModelingPrep API key and has only the latest prices), maturity_start=/maturity_end= (YYYY-MM-DD; alone they select every Treasury bill, note and bond maturing in between), etfs= and date= (the day of the Treasury prices). The present value, Z-spread and key rate durations use the US Treasury zero-coupon curve of the price date; yields are semi-annual bond-equivalent decimals and prices clean per 100 of par. TIPS yields are real yields and have no present value or Z-spread on the nominal curve; floating rate notes are left out. get_bond_equivalent_yield lists every Treasury bill with its discount yield and bond-equivalent yield. The rate calculations read the government bond curves of a country (country=, default United States) on a day (date=): get_forward_rate (near_maturity=, far_maturity=, on the zero-coupon curve, annually compounded), get_par_yield (years_to_maturity=, any maturity from the zero-coupon curve), get_yield_curve_spread (long_maturity=, short_maturity=, on the par curve, e.g. 10Y-2Y) and get_breakeven_inflation_rate (US nominal minus TIPS par yields). get_taylor_price_change with from_date= (YYYY-MM-DD) instead of yield_change= measures each Treasury from that day to date=: its own Yield Change, the Taylor estimate of the price change for it (Price Change) and the Realised Price Change of its clean FedInvest price, side by side; the Treasuries are selected on from_date and a weekend or holiday uses the business day before it. get_implied_default_probability turns the latest ICE BofA spread per rating (ratings='BBB,B') into hazard rates and default probabilities (recovery_rate=0.4, horizons='1,5,10'); it needs a FRED API key. get_treasury_securities lists every marketable US Treasury (about 460 bills, notes, bonds, TIPS and FRNs, by CUSIP) with price, yield and duration (date=, security_type='Bill'|'Note'|'Bond'|'TIPS'|'FRN', bonds=). get_bond_universe lists about 9,000 US corporate bonds (investment grade and high yield, by ISIN) from the daily holdings of bond ETFs, with the G-Spread over the Treasury par curve; narrow it with issuer=, bonds=, maturity_start=/maturity_end= and show_columns; etfs= picks other iShares bond funds (default 'LQD,IGSB,USHY', e.g. 'HYG' or 'MUB'). Yields are to maturity, so a callable bond above its call price yields less to its call date. get_issuer_spreads compares issuers at the same maturities: per issuer the G-Spread interpolated between its own bonds at maturity_years= (default '2,3,5,7,10,20,30', e.g. '5' for five years), with the number of Bonds and the Shortest and Longest maturities they cover; no spread outside that range (e.g. issuer='APPLE INC,BOEING,FORD MOTOR CREDIT,INTEL' with maturity_years='4.5'). Mortgage calculations at the weekly US 30-year fixed mortgage rate (Freddie Mac, no API key; a nominal annual rate compounded monthly), one row per survey date between start_date and end_date: get_loan_payment (the Payment, Total Interest and First Payment Interest of a new loan at each rate; principal= default 400000, years= default 30, payments_per_year= default 12), get_affordable_loan (the Affordable Loan a fixed payment repays at each rate and its Change since the first date; payment= defaults to the payment of principal= at the first rate in the range, so start_date='2021-01-01' compares today's loan with the same monthly budget in January 2021) and get_amortization_schedule (one row per payment with the Interest, Principal and Balance of a new loan at the rate of date=, default the latest)."
    module_name:     "fixedincome"
    category:        "standalone"
    index_category:  "fixed_income"
    method_override:
      - "collect_bond_statistics"
      - "get_present_value"
      - "get_duration"
      - "get_yield_to_maturity"
      - "get_z_spread"
      - "get_key_rate_duration"
      - "get_taylor_price_change"
      - "get_bond_equivalent_yield"
      - "get_par_yield"
      - "get_forward_rate"
      - "get_yield_curve_spread"
      - "get_breakeven_inflation_rate"
      - "get_implied_default_probability"
      - "get_treasury_securities"
      - "get_bond_universe"
      - "get_issuer_spreads"
      - "get_loan_payment"
      - "get_affordable_loan"
      - "get_amortization_schedule"

  # ── Discovery ────────────────────────────────────────────────────────────
  - tool_name:    "discovery"
    display_name: "Market Discovery"
    description:  "Market discovery (lists of stocks, ETFs, indices, currencies, commodities and cryptocurrencies, stock screener, biggest gainers and losers, most active stocks, sector and industry performance and P/E, earnings, IPO and stock split calendars, latest 8-K filings, insider trades and mergers, market news and press releases). No tickers or countries needed. The news and press release feeds (get_stock_news, get_press_releases, get_general_news, get_crypto_news, get_forex_news) are the latest articles across the whole market, not news about one company: each article names its ticker, but the feed cannot be narrowed to a ticker. The calendars and filings take start_date/end_date; the market-wide earnings calendar (get_earnings_calendar) covers the coming week unless a range is given and lists the largest companies first, one row per company (its primary, most traded listing; share classes with names of their own count as separate companies) with 'Market Cap (USD)'; min_market_cap= (in US dollars), country= (the company's country) and exchange= (e.g. 'XETRA') narrow it, sort_by='date' sorts by date and primary_only=false shows every listing. Its EPS and revenue are in the currency the source reports for each listing. Sector and industry performance and P/E take date= for one day's snapshot or sector=/industry= for a history (the last year unless start_date/end_date say otherwise); they average the companies of one exchange, exchange='NASDAQ' (default), 'NYSE' or 'AMEX', and performance is a decimal change (0.0125 is +1.25%). The stock screener ranks by market cap in US dollars ('Market Cap (USD)'; 'Market Cap' is in the listing's own currency) and returns every listing of a company unless primary_only=true; to screen by classification, use the Finance Database server. get_index_constituents lists the members of index='S&P 500', 'NASDAQ 100' or 'Dow Jones', today's or, with date=, those on a past date (with the date each left the index), free of survivorship bias; get_index_constituent_changes lists the dated additions and removals with their reasons (start_date/end_date). get_industry_statistics returns Aswath Damodaran's industry averages (about 95 industries plus the Total Market, computed every January from all listed companies, no key needed): dataset='cost_of_capital' (default; beta, cost of equity and debt, debt weights, WACC), 'betas' (levered and unlevered betas, the unlevered beta corrected for cash, D/E ratio), 'total_betas', 'margins', 'price_to_earnings', 'price_to_book', 'price_to_sales' or 'enterprise_value_multiples', for region='United States' (default), 'Europe', 'Japan', 'Australia, New Zealand and Canada', 'Emerging Markets', 'China', 'India' or 'Global'; rates and margins are decimals, betas and multiples plain numbers. Use show_columns to keep a few columns."
    module_name:  "discovery"
    category:     "discovery"

  # ── Raw Financial Data (Toolkit direct methods) ──────────────────────────
  # Method list is populated at startup from toolkit_direct_methods above.
  - tool_name:                    "market_data"
    display_name:                 "Raw Financial Data"
    description:                  "Raw financial data (historical prices, income statement, balance sheet, cash flow statement, company profile, quotes, analyst estimates (get_analyst_estimates: consensus revenue, EBITDA, EBIT, net income, SGA and EPS per period with the number of analysts behind the revenue and the EPS consensus, 'Number of Analysts Revenue' and 'Number of Analysts EPS'; far-out years often rest on a few), dividend/earnings calendars (with the scheduled dates after today, e.g. the next earnings release), statistics, market risk premium by country, CFTC Commitment of Traders report, executives and their compensation, company notes, employee count, share float, mergers and acquisitions, stock splits, insider trade statistics, institutional (13F) ownership per quarter, FINRA daily short sale volume, analyst stock grades, analyst price targets (get_price_targets: today's consensus, high, low and median with the upside to the share price, the dispersion, the revision momentum and the date of the most recent target with the days since; get_price_target_history: every published target with the upside it implied and the analyst company's previous target (published in the year before), its date and the Target Change; a target without a previous one is new coverage), monthly buy/hold/sell recommendation counts with the mean recommendation (get_analyst_recommendations), earnings call transcripts). Use this ONLY for raw data needs — for pre-computed ratios, performance, risk, or model metrics use the dedicated tools instead. Requires tickers='AAPL' — use comma-separated values for multiple tickers. basket=true adds a 'Total' to the financial statements, each line item the sum of the tickers (e.g. the combined capital expenditure of a group of companies with trailing=4 and quarterly=true; EPS and share counts stay empty). get_market_risk_premium (by country) and get_treasury_data (US Treasury rates) are market-wide and need no tickers. get_commitment_of_traders takes CFTC futures symbols, e.g. tickers='NG' (natural gas) or 'GC' (gold), not stocks. get_earnings_surprise gives per announcement the EPS and revenue against the analyst consensus (surprise as a decimal), the SUE and the share's reaction over days -1 to +1 against the benchmark. get_earnings_call_transcripts returns the full, never shortened text (often 40,000 to 60,000 characters) of one call of one ticker: the most recent, or the one of fiscal_period (e.g. '2025Q4', the company's own fiscal quarter); call it once per ticker and period. A period without a transcript is answered with the most recent periods that have one. Currency and crypto pairs may be written either way: EURUSD or EURUSD=X, BTCUSD or BTC-USD. get_short_volume is the daily short SALE volume FINRA reports for US-listed stocks (short volume, total FINRA-reported volume, short volume ratio and its z-score), not short interest; it covers the history_days (92 by default, one download per trading day) before end_date. To find which instruments exist, use the Finance Database server. The holdings, information and sector and country weightings of ETFs and funds are in the etf tool."
    module_name:                  "toolkit"
    index_category:               "market_data"
    category:                     "toolkit"
    use_direct_methods:   true
    basket:               true


# ──────────────────────────────────────────────────────────────────────────────
# Utility tools (search / discovery helpers — not router groups)
# These are registered by UtilityToolRegistry in tools_model.py.
# The MCP bundle's manifest.json lists every tool group and utility tool with
# the same description (tests/test_version_alignment.py checks this).
# ──────────────────────────────────────────────────────────────────────────────
utility_tools:
  - tool_name: "search_metric_categories"
    description: "List all available metric categories with tool counts and descriptions."

  - tool_name: "search_by_category"
    description: "List all metrics within a specific category by name."

  - tool_name: "search_metrics"
    description: "Fuzzy keyword search across all 500+ available methods."


# ──────────────────────────────────────────────────────────────────────────────
# Blocked period values per tool
# Some tool groups cannot meaningfully compute results at "daily" granularity
# (e.g. Sharpe Ratio, Beta, CAPM — standard deviation for 1 day is near zero).
# Listing a period here causes the wrapper to return an informative error
# instead of raising a confusing KeyError or returning empty data.
# ──────────────────────────────────────────────────────────────────────────────
# Risk (and econometrics) tools are not listed: their methods compute over the
# entire daily return series by default (within_period=False), which needs no intraday
# data. Performance metrics remain per-period by construction, and the server never
# fetches intraday data, so a daily period cannot work there.
# A rolling window reads the regular daily data, so the block does not apply when
# rolling is set, nor to get_style_analysis and get_beta_implied_return, which read the
# daily returns themselves.
blocked_periods:
  performance:
    - "daily"

# ──────────────────────────────────────────────────────────────────────────────
# MCP-only method defaults
# Applied by the tool wrapper when the caller leaves a parameter unset, so a broad
# question gets a focused, token-friendly answer. An explicit value always wins, and
# the Python methods keep their own defaults. lookback_days/lookahead_days replace the
# tool's default date range (five years) when the caller left both dates unset.
# ──────────────────────────────────────────────────────────────────────────────
method_defaults:
  # The zone of a distress score (Distress, Grey, Safe) by the cut-offs of the model asked
  # for, so they are not applied by hand. zone=false leaves it out.
  get_altman_z_score:
    zone: true
  get_zmijewski_score:
    zone: true
  get_springate_score:
    zone: true
  get_taffler_z_score:
    zone: true
  # One month of every country is over 2,000 releases (about 145,000 tokens); the
  # high-impact releases of a 30-day window around today are typically 50 to 150.
  get_economic_calendar:
    impact: "High"
    lookback_days: 23
    lookahead_days: 7
  # The default window ends today, which would hide the next (announced) report; it is
  # what a question about a company's earnings date is usually after.
  get_earnings_calendar:
    lookback_days: 1825
    lookahead_days: 120
  # Every company's releases of the coming week, starting today.
  discovery.get_earnings_calendar:
    lookback_days: 0
    lookahead_days: 7
    # A week holds thousands of releases, mostly small companies listed many times over;
    # the largest companies first, once each, is what fits in one answer.
    primary_only: true
    sort_by: "market_cap"
  # A world equity fund holds well over a thousand assets; the largest 25 are what a
  # question about its exposure needs. limit= asks for more.
  etf.get_holdings:
    limit: 25
  # Every holding is a price request; 500 covers the S&P 500 in full and keeps a world fund
  # of thousands of holdings to its largest. holdings= asks for others.
  etf.get_contribution:
    holdings: 500
  etf.get_return_excluding:
    holdings: 500
  # 150 maturities per country and month; maturity_years= asks for others.
  get_eiopa_risk_free_rate:
    maturity_years: [1, 2, 5, 10, 20, 30]
  # 10,000 joint draws are over four million characters; 100 show the shape of the
  # dependence. n_simulations= asks for more (larger answers are cut to the first rows).
  get_copula_simulation:
    n_simulations: 100
  # Every strike has a node per up and down move; the strikes within 5% of the price
  # (rather than 25%) keep the tree readable. strike_price_range= asks for more.
  get_binomial_model:
    strike_price_range: 0.05
  # Per million dollars traded, a large cap's price impact rounds to zero; per billion it
  # does not. scale= asks for another unit.
  get_amihud_illiquidity:
    scale: 1000000000
  # Every simulated path is a column (2,048 by default); the unique price levels per
  # step are the same information in about 20 rows.
  get_stock_price_simulation:
    show_unique_combinations: true
  # One FINRA download per trading day: the 92 days before end_date, as in Python, made
  # explicit here. history_days= asks for another window (see parameter_limits).
  get_short_volume:
    history_days: 92

# ──────────────────────────────────────────────────────────────────────────────
# Methods whose answer is only of use in full
# An earnings call transcript cut to fit the response size answers nothing, and one
# full transcript is already about as large as a response may be. These take one
# ticker, return one item (latest=false is refused) and are never cut.
# ──────────────────────────────────────────────────────────────────────────────
full_text_methods:
