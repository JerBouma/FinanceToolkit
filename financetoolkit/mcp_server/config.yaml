  # ── Environment & ESG (mixed: economics + toolkit) ───────────────────────
  # Carbon footprint and renewable energy come from Economics (use countries=).
  # ESG scores come from Toolkit (use tickers=). This is the only tool where
  # BOTH tickers= and countries= are accepted.
  - tool_name:       "environment"
    display_name:    "Environment & ESG"
    description:     "Environmental and ESG data. For ESG scores (E, S, G ratings) use tickers='AAPL'. For carbon footprint and renewable energy data use countries='United States' (also supports rolling=N and trailing=N smoothing/summation). This is the only tool that accepts BOTH tickers= and countries= depending on the indicator. get_carbon_price returns the EU ETS carbon price (EEX primary auctions of EU emission allowances, euro per tonne of CO2, daily from 2020, no key and no countries needed), period='daily', 'weekly' or 'monthly'. get_climate_scenario returns NGFS climate scenario paths (Phase 5, yearly 2022-2050, around fifty countries and regions, no key): variable='gdp'|'inflation'|'long_term_interest_rate'|'long_term_real_interest_rate'|'policy_rate'|'unemployment_rate'|'equity_prices'|'effective_exchange_rate'|'oil_price'|'gas_price'|'coal_price'|'carbon_price' (carbon price per model region to 2100), scenario='Net Zero 2050'|'Below 2°C'|'Low demand'|'Delayed transition'|'Nationally Determined Contributions (NDCs)'|'Current Policies'|'Fragmented World'|'Baseline', model='REMIND-MAgPIE'|'GCAM'|'MESSAGEix-GLOBIOM', risk='combined'|'transition'|'physical', deviation=true for the deviation from the baseline; countries= optional."
    module_name:     "mixed"
    category:        "mixed"
    index_category:  "environment"
    method_override:
      - "get_carbon_footprint"
      - "get_renewable_energy"
      - "get_carbon_price"
      - "get_climate_scenario"
