  - tool_name:      "momentum"
    display_name:   "Momentum Indicators"
    description:    "Momentum technical indicators (RSI, MACD, Stochastic Oscillator, Williams %R, Aroon, ADX, CCI, MFI, rate of change, Ichimoku Cloud, awesome, ultimate and Chande momentum oscillators, vortex, Know Sure Thing and more). Applied to price data automatically — no need to fetch prices first. Each indicator needs its window of history before it produces values, so the first periods after start_date can be empty and quarterly or yearly periods with long windows can be empty on short histories; start earlier to warm up. Requires tickers='AAPL' — use comma-separated values for multiple tickers. get_relative_strength gives the price relative to the benchmark, the Mansfield relative strength and a 1-99 relative strength rating across the tickers; get_seasonality the average return, hit rate and t-statistic per calendar month (frequency='month') or weekday (frequency='weekday'); get_signals the events per period: moving average crossovers (golden and death cross with the default 50 and 200), MACD crossovers, the RSI entering and leaving its overbought and oversold zones, Bollinger Band breakouts and new 52-week highs and lows, each 1 for a cross upwards, -1 for a cross downwards and 0 otherwise; signals_only=true returns only the periods with a signal (with limit=-5 the last five). get_indicator_summary summarises an indicator's history in one row per ticker instead of the daily series (use it rather than the full series for questions such as 'how low is the RSI compared with the last five years'): metric= the indicator (get_relative_strength_index by default, or any technical indicator, column= for one with several outputs), the latest value with its percentile and rank in its own history up to that date, the mean, minimum and maximum with their dates; below=30 (or above=70) adds the periods beyond the line, the number and last date of the crossings into that zone, and forward_periods=[5, 21, 63] the average return after those crossings next to the average return over every period; show_crossings=true lists every crossing with its value, percentile at the time and forward returns. Other parameters (e.g. window=) pass to the indicator. get_factor_analysis: factor analysis (predictive power) of the technical indicators across tickers: do the tickers that score high on one go on to return more than those that score low? Needs tickers= with at least ten, preferably twenty or more tickers. metrics= an indicator name, a comma-separated list, or a collection: 'momentum' (default), 'overlap', 'volatility', 'breadth' or 'all'; column= picks the output of a multi-output indicator (e.g. 'Signal Line'). Returns a row per metric and horizon: the mean information coefficient (IC, the Spearman rank correlation between the metric and the later returns), its standard deviation, IC information ratio, t-statistic, p-value, share of positive periods, number of periods, the Top Minus Bottom quantile spread, quantile turnover and rank autocorrelation. detail='information_coefficient', 'quantile_returns', 'quantile_turnover' or 'rank_autocorrelation' returns that part per period (or per quantile) for a single metric. period= sets how often it is evaluated (monthly by default), horizons= the periods ahead (e.g. 12 or [1, 12]), quantiles= the number of quantiles (5). Other parameters (e.g. window=) pass to the indicators; indicators in price units are used relative to the close. The IC is reported as measured: a negative IC means low values go on to outperform."
