  # ── Environment & ESG (mixed: economics + toolkit) ───────────────────────
  # Carbon footprint and renewable energy come from Economics (use countries=).
  # ESG scores come from Toolkit (use tickers=). This is the only tool where
  # BOTH tickers= and countries= are accepted.
  - tool_name:       "environment"
    display_name:    "Environment & ESG"
    description:     "Environmental and ESG data. For ESG scores (E, S, G ratings) use tickers='AAPL'. For carbon footprint and renewable energy data use countries='United States' (also supports rolling=N and trailing=N smoothing/summation). This is the only tool that accepts BOTH tickers= and countries= depending on the indicator."
    module_name:     "mixed"
    category:        "mixed"
    index_category:  "environment"
    method_override:
      - "get_carbon_footprint"
      - "get_renewable_energy"
      - "get_esg_scores"
    method_to_module:
      get_carbon_footprint:
        module:   "economics"
        category: "standalone"
      get_renewable_energy:
        module:   "economics"
        category: "standalone"
      get_esg_scores:
        module:   "toolkit"
        category: "toolkit"

  # ── Economics: Jobs & Society ────────────────────────────────────────────
  # Unemployment, labour productivity, population, poverty, income inequality.
  - tool_name:       "jobs"
    display_name:    "Jobs & Society"
    description:     "Labour and social metrics by country (unemployment rate, labour productivity, population statistics, poverty rate, income inequality). Requires countries='United States' — use comma-separated values for multiple countries. Do NOT use tickers= for this tool. Supports start_date/end_date and quarterly=true. Supports rolling=N (moving-average smoothing) and trailing=N (trailing N-period sum) on the raw series. Also includes two US-only, FRED-backed labor indicators (get_nonfarm_payrolls, get_initial_jobless_claims) — these require a FRED API key and only return a 'United States' column regardless of the countries= argument."
    module_name:     "economics"
    category:        "standalone"
    index_category:  "jobs_and_society"
    method_override:
      - "get_income_inequality"
      - "get_labour_productivity"
      - "get_population_statistics"
      - "get_poverty_rate"
      - "get_unemployment_rate"
      - "get_nonfarm_payrolls"
      - "get_initial_jobless_claims"

  # ── Interest Rates (mixed: economics + fixedincome) ──────────────────────
  # Short/long-term interest rates and central bank policy from Economics.
  # Government bond yields, ICE BofA corporate bond series, EURIBOR,
  # ECB rates, and Federal Reserve rates from FixedIncome.
  # All indicators use countries= (both modules are CATEGORY_STANDALONE).
  - tool_name:       "rates"
    display_name:    "Interest Rates"
    description:     "Interest rate data (central bank policy rates, short/long-term rates, government bond yields, ICE BofA corporate bond series, EURIBOR, ECB rates, Federal Reserve rates, official U.S. Treasury par yield curve, yield curve slope). Requires countries='United States' — use comma-separated values for multiple countries. Do NOT use tickers= for this tool. Supports start_date/end_date and quarterly=true. The central bank policy rate, short/long-term rate, and yield curve slope indicators additionally support rolling=N (moving-average smoothing) and trailing=N (trailing N-period sum). Also includes get_mortgage_rate_30_year, get_real_yield_curve (FRED TIPS real yields) and get_breakeven_inflation_expectations — three US-only FRED-backed indicators. A FRED API key is optional and free (get one at https://fred.stlouisfed.org/docs/api/api_key.html); without it these three return no data, while get_treasury_rates and every other indicator in this tool work without one. FRED-backed indicators only return a 'United States' column regardless of the countries= argument."
    module_name:     "mixed"
    category:        "mixed"
    index_category:  "interest_rates"
    method_override:
      - "get_central_bank_policy_rate"
      - "get_short_term_interest_rate"
      - "get_long_term_interest_rate"
      - "get_government_bond_yield"
      - "get_euribor_rates"
      - "get_european_central_bank_rates"
      - "get_federal_reserve_rates"
      - "get_ice_bofa_effective_yield"
      - "get_ice_bofa_option_adjusted_spread"
      - "get_ice_bofa_total_return"
      - "get_ice_bofa_yield_to_worst"
      - "get_mortgage_rate_30_year"
      - "get_real_yield_curve"
      - "get_breakeven_inflation_expectations"
      - "get_treasury_rates"
      - "get_yield_curve_slope"
    method_to_module:
      get_central_bank_policy_rate:
        module:   "economics"
        category: "standalone"
      get_short_term_interest_rate:
        module:   "economics"
        category: "standalone"
      get_long_term_interest_rate:
        module:   "economics"
        category: "standalone"
      get_government_bond_yield:
        module:   "fixedincome"
        category: "standalone"
      get_euribor_rates:
        module:   "fixedincome"
        category: "standalone"
      get_european_central_bank_rates:
        module:   "fixedincome"
        category: "standalone"
      get_federal_reserve_rates:
        module:   "fixedincome"
        category: "standalone"
      get_ice_bofa_effective_yield:
        module:   "fixedincome"
        category: "standalone"
      get_ice_bofa_option_adjusted_spread:
        module:   "fixedincome"
        category: "standalone"
      get_ice_bofa_total_return:
        module:   "fixedincome"
        category: "standalone"
      get_ice_bofa_yield_to_worst:
        module:   "fixedincome"
        category: "standalone"
      get_mortgage_rate_30_year:
        module:   "economics"
        category: "standalone"
      get_real_yield_curve:
        module:   "economics"
        category: "standalone"
      get_breakeven_inflation_expectations:
        module:   "economics"
        category: "standalone"
      get_treasury_rates:
        module:   "fixedincome"
        category: "standalone"
      get_yield_curve_slope:
        module:   "economics"
        category: "standalone"

  # ── Fixed Income: Bond & Derivative Valuations ───────────────────────────
  # Computational valuation tools: bond duration, present value,
  # yield-to-maturity, and derivative pricing models.
  - tool_name:       "fixed_income"
    display_name:    "Bond & Derivative Valuations"
    description:     "Bond and derivative valuation calculations (bond duration, present value, yield-to-maturity, derivative pricing, par yield, forward rate, breakeven inflation rate, key rate duration, yield curve spread, Z-spread, bond-equivalent yield, Taylor-series price change estimate). No tickers or countries needed — provide bond/derivative parameters (e.g. face_value, coupon_rate, maturity, spot_rates) directly as arguments."
    module_name:     "fixedincome"
    category:        "standalone"
    index_category:  "fixed_income_valuations"
    method_override:
      - "get_derivative_price"
      - "get_duration"
      - "get_present_value"
      - "get_yield_to_maturity"
      - "get_par_yield"
      - "get_forward_rate"
      - "get_breakeven_inflation_rate"
      - "get_key_rate_duration"
      - "get_yield_curve_spread"
      - "get_z_spread"
      - "get_bond_equivalent_yield"
      - "get_taylor_price_change"

  # ── Discovery ────────────────────────────────────────────────────────────
  - tool_name:    "discovery"
    display_name: "Market Discovery"
    description:  "Market discovery tools (lists of stocks/ETFs/cryptocurrencies, stock screener, gainers, losers, sector performance, earnings/dividend calendars). No tickers or countries needed."
    module_name:  "discovery"
    category:     "discovery"

  # ── Raw Financial Data (Toolkit direct methods) ──────────────────────────
  # Method list is populated at startup from toolkit_direct_methods above.
  - tool_name:                    "market_data"
    display_name:                 "Raw Financial Data"
    description:                  "Raw financial data (historical prices, income statement, balance sheet, cash flow statement, company profile, quotes, analyst estimates, dividend/earnings calendars, statistics, market risk premium by country, CFTC Commitment of Traders report). Use this ONLY for raw data needs — for pre-computed ratios, performance, risk, or model metrics use the dedicated tools instead. Requires tickers='AAPL' — use comma-separated values for multiple tickers. get_market_risk_premium and get_commitment_of_traders are ticker/country-agnostic snapshots and ignore most other parameters."
    module_name:                  "toolkit"
    category:                     "toolkit"
    use_direct_methods:   true


# ──────────────────────────────────────────────────────────────────────────────
# Utility tools (search / discovery helpers — not router groups)
# These are registered by UtilityToolRegistry in tools_model.py.
# Listed here so build-mcpb.sh can include them in the manifest without
# hard-coding them in the build script.
#
# summary (optional on any tool): Short description used in the mcpb
# marketplace listing. Falls back to description if absent. description is
# the AI-facing prompt hint and may be verbose.
# ──────────────────────────────────────────────────────────────────────────────
utility_tools:
  - tool_name: "search_categories"
    description: "List all available metric categories with tool counts and descriptions."

  - tool_name: "search_by_category"
    description: "List all metrics within a specific category by name."

  - tool_name: "search_metrics"
    description: "Fuzzy keyword search across all 500+ available methods."

  - tool_name: "search_instruments"
    description: "Look up ticker symbols by company name, ISIN, CIK, CUSIP, or keyword."


# ──────────────────────────────────────────────────────────────────────────────
# Blocked period values per tool
# Some tool groups cannot meaningfully compute results at "daily" granularity
# (e.g. Sharpe Ratio, Beta, CAPM — standard deviation for 1 day is near zero).
# Listing a period here causes the wrapper to return an informative error
# instead of raising a confusing KeyError or returning empty data.
# ──────────────────────────────────────────────────────────────────────────────
blocked_periods:
  performance:
    - "daily"
  risk:
    - "daily"
