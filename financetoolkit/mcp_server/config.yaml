# ──────────────────────────────────────────────────────────────────────────────
# Finance Toolkit MCP Server — Configuration
#
# All module-level constants for the MCP server live here.
# Edit this file to add/remove tools, adjust defaults, or tune behaviour
# without touching Python source code.  Comments explain every key.
# ──────────────────────────────────────────────────────────────────────────────

# ──────────────────────────────────────────────────────────────────────────────
# Category identifiers
# These strings are used internally to route MCP tool calls to the correct
# dispatch path in provider_model.py:
#   ticker     — sub-module accessed via a Toolkit instance (needs tickers=)
#   toolkit    — method called directly on a Toolkit instance (needs tickers=)
#   standalone — module instantiated with countries/dates only (no tickers)
#   discovery  — Discovery controller; no tickers, no date range
#   portfolio  — a Portfolio built from transactions, weights, holdings or a preset
#   mixed      — spans multiple modules / categories; per-indicator routing
# ──────────────────────────────────────────────────────────────────────────────
categories:
  ticker:     "ticker"
  toolkit:    "toolkit"
  standalone: "standalone"
  discovery:  "discovery"
  portfolio:  "portfolio"
  mixed:      "mixed"


# ──────────────────────────────────────────────────────────────────────────────
# SQLite result-cache defaults
# The database is always stored next to the global Finance Toolkit .env file:
#   macOS / Linux  — $XDG_CONFIG_HOME/financetoolkit/financetoolkit_cache.db
#                    (falls back to ~/.config/financetoolkit/financetoolkit_cache.db)
#   Windows        — %APPDATA%\financetoolkit\financetoolkit_cache.db
# The path can be overridden at runtime with:
#   FINANCE_TOOLKIT_CACHE_DB       — absolute path to the SQLite file
#   FINANCE_TOOLKIT_CACHE_TTL      — TTL in seconds (integer)
#   FINANCE_TOOLKIT_CACHE_ENABLED  — true/false, overrides the "auto" below
#
# enabled is one of "full", "shared", "off" (or true/false for full/off) or "auto":
#   full    everything: the source data and the tool responses (ttl_seconds).
#   shared  the source data of every source except FinancialModelingPrep, and no
#           tool responses.
#   off     nothing; every request is fetched live.
# "auto" means full for a local server (stdio transport, one user, one machine)
# and shared for a hosted one (MCP_TRANSPORT=sse or streamable-http). A hosted
# server serves every user from one process against one database. Its users share
# the official statistics, Yahoo Finance and the other public sources, while
# FinancialModelingPrep data belongs to each subscriber and is always retrieved
# with the user's own key. A tool response is not shared, since it may be
# calculated from FinancialModelingPrep data.
# ──────────────────────────────────────────────────────────────────────────────
cache:
  enabled: auto
  ttl_seconds: 600

# ──────────────────────────────────────────────────────────────────────────────
# Response size
# A response larger than this many characters (about four per token) is cut to its
# most recent rows, or its first columns, with a note on how to narrow the request,
# so a broad question cannot flood the client's context. FT_MCP_MAX_RESPONSE_CHARACTERS
# overrides it; 0 switches the limit off.
# ──────────────────────────────────────────────────────────────────────────────
responses:
  max_characters: 60000

# ──────────────────────────────────────────────────────────────────────────────
# Size limits
# The parameters that decide how much a call simulates, computes or downloads are
# capped, so one call cannot take the memory of a server others share. The Python
# methods keep their own, wider limits.
# maximums caps a value (every value of a list); products caps parameters that are
# computed together (simulated paths times their steps), with the indicator's own
# default for a parameter the caller left out; refused_values lists the values of a
# parameter an indicator does not take on the server. A call over a limit is refused
# with the limit, before anything is collected.
# ──────────────────────────────────────────────────────────────────────────────
parameter_limits:
  # The most option values per ticker of an option grid: strike prices times expirations,
  # times the nodes of a binomial tree, and for a Monte Carlo price with a variance
  # reduction or Sobol points one value per 1,000 paths (per 500 for Monte Carlo Asian
  # options). The server lowers the package's cap (MAX_OPTION_VALUES in options/helpers.py)
  # to this value at startup. The slowest methods at 750,000 values (10,001 strikes of a
  # price of 5,000 in steps of 0.5 over 75 expirations) take about 47 seconds per ticker for
  # a QD+ put, 48 for a Bjerksund-Stensland put, 39 for a soft barrier, 25 for the control
  # variate Monte Carlo price; the closed forms on arrays (Black-Scholes, Greeks, barriers,
  # lookbacks, Asian approximations, quadratic American approximations) take 2 to 30.
  option_values: 750000
  # The most items of a list parameter, per parameter or as indicator.parameter. The Heston
  # calibration solves the implied volatility of every quote of each expiration and fits
  # them together, like the volatility surfaces (about 2.5 seconds per expiration for two
  # tickers): twelve expirations, as number_of_expirations of the surfaces.
  lengths:
    get_heston_parameters.expiration_dates: 12
    get_heston_parameters.expiration_months: 12
  maximums:
    # Every simulated draw of a copula is a row of the answer, with a column per ticker.
    get_copula_simulation.simulations: 10000
    # Monte Carlo valuations and option prices (paths per ticker and expiration).
    simulations: 100000
    # Monte Carlo steps per path.
    time_steps: 1000
    # Asian option fixings, each a step of every Monte Carlo path.
    fixings: 1000
    # A binomial tree per strike has (time_steps + 1)² nodes.
    get_binomial_model.time_steps: 50
    get_stock_price_simulation.time_steps: 50
    # Short rate simulations; see products for their combined size.
    get_short_rate_simulation.simulations: 10000
    # Every bootstrap series of a GARCH simulation is fitted again: about 0.5 seconds for
    # GARCH(1, 1) and 6 for FIGARCH on ten years of daily returns.
    get_garch_simulation.bootstrap_fits: 5
    steps_per_year: 52
    years: 50
    # Option grids have a value per strike and expiration day.
    strike_price_range: 0.5
    expiration_time_range: 366
    number_of_strikes: 1000
    # Each expiration, holding, page, contract or day is a download of its own.
    number_of_expirations: 24
    holdings: 500
    pages: 10
    contracts: 36
    history_days: 366
    limit: 10000
    # Resampling, optimization and model orders, each a fit or a loop of its own. The
    # estimation uncertainty has a product with the tickers instead.
    get_var_backtest.n_bootstrap: 1000
    get_acerbi_szekely_test.n_bootstrap: 1000
    get_bootstrap_statistics.n_bootstrap: 1000
    get_model_confidence_set.n_bootstrap: 1000
    get_quantile_regression.n_bootstrap: 1000
    get_estimation_uncertainty.n_bootstrap: 100000
    # Simulated paths of the bubble tests' critical values, each as costly as the test; 2,000
    # is the default, as in Phillips, Shi and Yu (2015). See products for the years.
    get_bubble_test.simulations: 2000
    get_bubble_episodes.simulations: 2000
    get_chow_dickey_fuller_test.simulations: 2000
    # Lagged differences of the bubble tests' ADF regressions: with lags every window is a
    # small linear solve rather than a closed form, and the simulation repeats it per path.
    lag_order: 2
    # Michaud resampling solves an optimization per resample: about 0.1 s each for 50
    # tickers of daily returns, so 1,000 resamples take about 100 s.
    resamples: 1000
    # Two years of daily returns per estimate of a walk-forward backtest; minimum CVaR,
    # minimum drawdown and the Omega and CVaR ratio optimizers solve a linear programme
    # with variables per day of the lookback at every rebalancing. 50 tickers over 21
    # years, monthly, with all thirteen methods take about 95 s with a lookback of 252
    # days, 140 s with 504 and 210 s with 756. Minimum MAD and minimum semideviation take
    # about two and five times as long per rebalancing as minimum CVaR (50 tickers, 504
    # days); random weights take no time.
    lookback: 504
    points: 100
    # A discrete allocation counts whole shares; beyond this value the share counts
    # outgrow the precision of the integer programme.
    portfolio_value: 10000000000
    max_breaks: 10
    # A Markov switching fit searches the likelihood from several starts: ten years of daily
    # returns take about 28 seconds per ticker with three regimes and 70 with four.
    regimes: 3
    # A year of daily forecasts for the ARIMA, VAR and VECM models; the GARCH forecasts
    # and simulations keep their own horizon of 1,000 periods.
    get_arima_forecast.forecast_steps: 365
    get_var_forecast.forecast_steps: 365
    get_vecm_forecast.forecast_steps: 365
    get_garch_forecast.forecast_steps: 1000
    get_garch_simulation.forecast_steps: 1000
    periods: 100
    project_periods: 100
    high_growth_periods: 100
    transition_periods: 100
    lags: 100
    max_lag: 100
    # Lagged differences of the Johansen test and the VECM, a parameter per lag and series.
    get_johansen_cointegration.lags: 20
    get_vecm_forecast.lags: 20
    p: 10
    d: 2
    q: 10
    power: 5
    # The memory, fractal and chaos measures compare every embedded vector with every other
    # one: ten years of daily returns take 0.6 to 1.6 seconds per ticker with an embedding of
    # 10 and grow with the embedding and the trajectory followed.
    embedding: 20
    matrix_dimension: 10
    trajectory_length: 100
    kmax: 100
    # A maximum of one indicator is written indicator.parameter. The sample and approximate
    # entropy compare every pair of the window's returns, in every window: a rolling window
    # of 252 days takes about 2 seconds per ticker over ten years and one of 1,000 days about
    # 16 seconds; 504 days (two years) takes about 6.
    get_entropy.rolling: 504
    # Trend scanning fits a regression per forward window length and date: ten years of daily
    # prices take about 0.9 seconds per ticker with windows up to 63 periods (a quarter), 3
    # seconds up to 126 and 10 seconds up to 252.
    get_trend_scanning_labels.maximum_window: 63
    # The reserve bet sizes solve the five moment equations of a mixture of two normals from
    # every starting point: 100 runs take about 0.3 seconds per ticker, 1,000 about 3.
    get_bet_sizes.runs: 1000
    # The volatility surfaces solve the implied volatility of every quote (about 2.5 seconds
    # per expiry for two tickers) and fit each expiry: raw SVI takes 1.5 to 2.5 seconds per
    # expiry and ticker, SABR about 0.5 and SSVI 0.3 for all expiries of a ticker together.
    # Six expiries take about 18 seconds for two tickers with SVI or SABR and 5 with SSVI;
    # twelve keep SVI within about 40.
    get_volatility_surface.number_of_expirations: 12
    get_local_volatility_surface.number_of_expirations: 12
    # A Heston-Nandi price runs the GARCH recursion over every trading day to its expiration,
    # about 0.05 seconds per expiration a quarter out: a quarter of expirations takes about
    # two seconds per ticker, a year about twelve.
    get_heston_nandi_model.expiration_time_range: 92
    # A cliquet prices a forward-start option per period, for every expiration day.
    get_forward_start_option.periods: 52
    # The hedging simulation holds paths × days prices and deltas: 10,000 paths of 504 days
    # take about a second per ticker and 120 MB.
    get_delta_hedging_simulation.days: 504
    get_delta_hedging_simulation.simulations: 10000
    # The optimal trading rules simulate paths × maximum_holding_period steps once and try
    # grid_size² rules on them: 10,000 paths of 100 steps with a 20 × 20 mesh take about a
    # second per ticker; see products for the paths and steps together.
    get_optimal_trading_rule.grid_size: 40
    get_optimal_trading_rule.maximum_holding_period: 500
    get_optimal_trading_rule.simulations: 10000
    # GARCH simulations hold paths × forecast_steps returns; see products.
    get_garch_simulation.simulations: 10000
  # Values of a parameter an indicator refuses, with the reason given in the answer.
  # EGARCH fits take around 45 seconds per ticker (a deterministic multi-start search),
  # longer than an assistant waits for a tool; GARCH and GJR-GARCH remain available.
  # AVGARCH and GARCH-in-mean run their recursion step by step: about 18 and 9 to 13
  # seconds per ticker of ten years of daily returns, against 1 to 4 seconds for the
  # other models, distributions and mean models.
  refused_values:
    # The QD fixed point solves the exercise boundary by iteration, about 0.1 seconds per
    # price: the default grid of 21 strikes and 29 expirations takes about a minute per
    # ticker, and 366 expirations ten times longer.
    - methods: ["get_american_option"]
      parameter: "method"
      values: ["qd_fixed_point"]
      reason: >-
        The QD fixed point takes about 0.1 seconds per price, so a grid of strikes and
        expirations takes minutes. Please use method='qd_plus' (the default), within about
        0.3% of the exact American value.
    # Least-squares Monte Carlo regresses the continuation value at every time step for every
    # strike and expiration: the default grid of two tickers (10,000 paths of 100 steps, 29
    # expirations) takes about two minutes, against 2 seconds for the European price.
    - methods: ["get_monte_carlo_option_price"]
      parameter: "american_option"
      values: ["true"]
      reason: >-
        Least-squares Monte Carlo of American options takes minutes for a grid of strikes and
        expirations. Please use get_american_option, with method='qd_plus' (the default) or
        method='finite_difference', which solve the same American value in seconds.
    # GSADF fits about (T - w)² / 2 regressions per series and per simulated path: ten
    # years of daily prices take about 0.14 seconds per path, so 2,000 simulations take
    # about 5 minutes, longer than an assistant waits. Ten years of weekly data (the MCP
    # default) take about 16 seconds.
    - methods: ["get_bubble_test", "get_bubble_episodes"]
      parameter: "period"
      values: ["daily"]
      reason: >-
        The bubble tests fit a regression for every window of the series and simulate their
        critical values, which on daily data takes minutes. Please use period='weekly' (the
        default here) or 'monthly', as Phillips, Shi and Yu do.
    - methods: ["get_garch", "get_garch_forecast", "get_garch_parameters", "get_news_impact_curve", "get_garch_simulation", "get_sign_bias_test", "get_pearson_goodness_of_fit_test", "get_nyblom_test", "get_gmm_moment_test"]
      parameter: "method"
      values: ["egarch"]
      reason: >-
        EGARCH fits take about 45 seconds per ticker, longer than an assistant waits for
        a tool. Please use method='gjr' (GJR-GARCH, also asymmetric) or method='garch'.
    - methods: ["get_garch", "get_garch_forecast", "get_garch_parameters", "get_news_impact_curve", "get_garch_simulation", "get_sign_bias_test", "get_pearson_goodness_of_fit_test", "get_nyblom_test", "get_gmm_moment_test"]
      parameter: "method"
      values: ["avgarch"]
      reason: >-
        AVGARCH fits take about 20 seconds per ticker, longer than an assistant waits for
        a tool. Please use method='tgarch' (the absolute value model without a shift) or
        method='aparch'.
    - methods: ["get_garch", "get_garch_forecast", "get_garch_parameters", "get_news_impact_curve", "get_garch_simulation", "get_sign_bias_test", "get_pearson_goodness_of_fit_test", "get_nyblom_test", "get_gmm_moment_test"]
      parameter: "mean"
      values: ["in_mean"]
      reason: >-
        GARCH-in-mean fits take 10 seconds or more per ticker, longer than an assistant
        waits for a tool. Please use mean='constant' or mean='arma'.
    # The realized GARCH has eight parameters and a joint likelihood of the returns and the
    # Parkinson variance: about 14 seconds per ticker of ten years of daily returns. The
    # ARFIMA mean takes a fractional difference over the whole sample in every step of the
    # search: about 10 seconds per ticker, and a minute with 20 bootstrap refits.
    - methods: ["get_garch", "get_garch_forecast", "get_garch_parameters", "get_news_impact_curve", "get_garch_simulation", "get_sign_bias_test", "get_pearson_goodness_of_fit_test", "get_nyblom_test", "get_gmm_moment_test"]
      parameter: "method"
      values: ["realized"]
      reason: >-
        Realized GARCH fits take about 15 seconds per ticker, longer than an assistant
        waits for a tool. Please use method='garch', 'gjr' or 'figarch'.
    - methods: ["get_garch", "get_garch_forecast", "get_garch_parameters", "get_news_impact_curve", "get_garch_simulation", "get_sign_bias_test", "get_pearson_goodness_of_fit_test", "get_nyblom_test", "get_gmm_moment_test"]
      parameter: "mean"
      values: ["arfima"]
      reason: >-
        ARFIMA mean fits take 10 seconds or more per ticker, longer than an assistant
        waits for a tool. Please use mean='constant' or mean='arma'.
    # The GARCH VaR, backtests and forecast tests take the variance models of get_garch whose
    # rolling refits stay within seconds: GARCH, GJR-GARCH and IGARCH. The power and family
    # models (APARCH, TGARCH, NGARCH, NAGARCH, AVGARCH) and EGARCH can take minutes per ticker
    # over years of daily returns, and the component model, whose optimum often sits on a bound
    # (Phi = 0) so that most refits also run the multi-start search, about a minute. FIGARCH
    # sums 1,000 lags of squared residuals in every step: 2 to 5 seconds per fit.
    - methods: ["get_value_at_risk", "get_conditional_value_at_risk", "get_var_backtest", "get_acerbi_szekely_test", "get_berkowitz_test", "get_hong_li_test"]
      parameter: "garch_method"
      values: ["egarch", "avgarch", "aparch", "tgarch", "ngarch", "nagarch", "component", "figarch"]
      reason: >-
        Rolling fits of this model take a minute or more per ticker, longer than an assistant
        waits for a tool. Please use garch_method='garch', 'gjr' or 'igarch'.
    - methods: ["get_model_confidence_set"]
      parameter: "models"
      values: ["egarch", "avgarch", "aparch", "tgarch", "ngarch", "nagarch", "component", "figarch"]
      reason: >-
        Rolling fits of this model take a minute or more per ticker, longer than an assistant
        waits for a tool. Please compare 'ewma', 'rolling', 'garch', 'gjr' or 'igarch'.
    # A walk-forward backtest estimates the covariance at every rebalancing: the CCC-GARCH
    # covariance fits a GARCH model per ticker (about 2.5 seconds each on a year of daily
    # returns) and the MM and Rocke estimators start from the minimum covariance determinant
    # (1 to 4 seconds), so twenty years of monthly rebalancing take many minutes.
    - methods: ["get_optimization_backtest"]
      parameter: "covariance"
      values: ["ccc_garch", "mm", "rocke"]
      reason: >-
        These covariance estimators take seconds per estimate, and the backtest estimates
        the covariance at every rebalancing, which takes many minutes. Please use them with
        the optimizers or get_covariance_estimate, and covariance='sample',
        'ledoit_wolf' or 'denoised' in the backtest.
  # The rolling GARCH VaR, backtests and forecast tests refit their model every refit_every
  # returns: seven years of daily returns take about 5 to 15 seconds per ticker with a refit every
  # 21 returns (GARCH(1, 1), GJR-GARCH and IGARCH; normal, Student-t or Johnson SU innovations),
  # up to about a minute with skewed-t innovations on some series, 41 seconds every 5 returns
  # (GARCH(1, 1), normal) and about three minutes every return.
  minimums:
    refit_every: 21
    # Listed options are struck at least 0.5 apart. A finer step multiplies the strikes of
    # every option grid (up to 10,000 per ticker): a step of 0.01 on a price of 200 gives
    # 10,000 strikes at the default range, 900,000 QD+ prices over 90 expirations. At 0.5 the
    # widest range has at most twice the price in strikes.
    strike_step_size: 0.5
  products:
    # 10,000 paths of 100 steps per expiration by default.
    - parameters: [simulations, time_steps]
      maximum: 5000000
    # Monte Carlo Asian options simulate a price at each fixing of every path.
    - parameters: [simulations, fixings]
      maximum: 5000000
    # Monte Carlo Asian options simulate their paths again for every expiration day, a
    # price at each fixing (or each time step without fixings). The closed-form methods of
    # get_asian_option do not simulate, so the product applies to method='monte_carlo' only.
    # 10,000 paths of 100 fixings over 365 expirations take about 29 seconds per ticker for
    # one strike; the option_values cap covers the strikes. The Monte Carlo option price draws
    # its paths once for all expirations (50,000 paths over 365 expirations and 1,001 strikes
    # take about 3 seconds), so it needs no product with the expirations.
    - methods: [get_asian_option]
      when: {method: [monte_carlo]}
      parameters: [simulations, "fixings|time_steps", expiration_time_range]
      maximum: 400000000
    # 10,000 paths of ten years of monthly steps by default.
    - methods: [get_short_rate_simulation]
      parameters: [simulations, steps_per_year, years]
      maximum: 5000000
    # The rolling GARCH VaR, backtests and forecast tests refit their model every refit_every
    # returns over the years of the range: four years of daily returns with a refit every 21
    # returns (48 refits) take 2.2 to 8.2 seconds per ticker (GARCH(1, 1), GJR-GARCH with
    # Student-t innovations and the GARCH model of the GBM forecast), up to 0.17 seconds a
    # refit. At most 0.5 (ten and a half years with a refit every 21 returns, 126 refits)
    # keeps them within about 25 seconds per ticker.
    - methods: [get_value_at_risk, get_conditional_value_at_risk, get_var_backtest, get_acerbi_szekely_test]
      when: {method: [garch]}
      parameters: [range_years, "1/refit_every"]
      maximum: 0.5
      hint: "Please use a shorter range (start_date and end_date) or a larger refit_every."
    - methods: [get_berkowitz_test, get_hong_li_test]
      when: {model: [garch]}
      parameters: [range_years, "1/refit_every"]
      maximum: 0.5
      hint: "Please use a shorter range (start_date and end_date) or a larger refit_every."
    - methods: [get_model_confidence_set]
      parameters: [range_years, "1/refit_every"]
      maximum: 0.5
      hint: "Please use a shorter range (start_date and end_date) or a larger refit_every."
    # The bubble tests fit a regression for every pair of window start and end, per series and
    # per simulated path of the critical values: ten years of weekly prices with the default
    # 2,000 simulations take about 24 seconds per ticker, growing with the square of the
    # years. At most 400,000 (about 14 years at 2,000 simulations) keeps them within about
    # 50 seconds.
    - methods: [get_bubble_test, get_bubble_episodes]
      parameters: [range_years, range_years, simulations]
      maximum: 400000
      hint: "Please use a shorter range (start_date and end_date) or fewer simulations."
    # An ARIMA fit searches the likelihood over p + q coefficients in a state space model:
    # ten years of daily prices take about 17 seconds per ticker with p = q = 5 and 96 with
    # p = q = 10.
    - methods: [get_arima_forecast]
      parameters: [p, q]
      maximum: 25
      hint: "Please use smaller orders p and q, such as p=5 and q=5 or less."
    # The forecast cone simulates simulations × horizon returns in chunks: 100,000 paths of
    # a year (25 million returns) take about a second per ticker.
    - methods: [get_forecast_cone]
      parameters: [simulations, horizon]
      maximum: 1000000000
    # The estimation uncertainty bootstraps the returns of all tickers together and
    # re-estimates every ticker in each bootstrap sample: 20,000 samples of 50 tickers over
    # five years of daily returns take about 25 seconds.
    - methods: [get_estimation_uncertainty]
      parameters: [n_bootstrap, tickers]
      maximum: 1000000
      hint: "Please use fewer bootstrap samples (n_bootstrap) or tickers."
    # GARCH simulations: 10,000 paths of 10 steps per ticker by default.
    - parameters: [simulations, forecast_steps]
      maximum: 5000000
    # Optimal trading rules: 10,000 paths of 100 steps per ticker by default, held in memory.
    - parameters: [simulations, maximum_holding_period]
      maximum: 5000000

# ──────────────────────────────────────────────────────────────────────────────
# Hosted server limits
# A hosted server (MCP_TRANSPORT=sse or streamable-http) shares its work slots among
# everyone. A call is answered with a timeout after call_timeout_seconds, and each
# user (an API key) has at most calls_per_user calls running at a time; a further
# call is refused until one of them finishes. A local server has neither limit.
# ──────────────────────────────────────────────────────────────────────────────
hosted_limits:
  call_timeout_seconds: 180
  calls_per_user: 3

# ──────────────────────────────────────────────────────────────────────────────
# Server instructions
# Sent to the client once when it connects, so an agent knows how to find an
# indicator and how to read and narrow the answers before its first call.
# ──────────────────────────────────────────────────────────────────────────────
instructions: >-
  The Finance Toolkit calculates financial data with 1100+ metrics: prices and
  financial statements, ratios, valuation and risk models, performance, technical
  indicators, options and bonds, econometrics and macroeconomic data by country. Each
  tool groups indicators of one kind; pass the indicator by name (e.g. valuation with
  indicator='get_price_to_earnings_ratio'); up to five indicators of one tool go in one
  call as a list (indicator=['get_price_to_earnings_ratio', 'get_ev_to_ebitda_ratio']), each
  answered under its name with the same arguments. When unsure which indicator or tool fits,
  call search_metrics with what you want to measure. The tool schemas describe the
  parameters in a few words; search_metrics with an indicator's exact name (e.g.
  'get_garch') gives what it calculates and every parameter it takes with its full
  description, options and default. Company tools take tickers (e.g. 'AAPL,ASML.AS');
  country tools take countries (e.g. 'United States,Germany'). Rates, ratios and returns
  are decimal fractions (0.05 is 5%), and a 'Benchmark' entry is the benchmark ticker
  (SPY unless benchmark_ticker says otherwise). Every indicator tool takes limit, rank,
  rebase_to, sample and show_columns. Keep answers small: limit=-5 gives the last five
  rows of a time series (5 the first five, 0 every row; a table with periods as columns,
  such as financial statements and ratios, keeps its last or first periods; ETF holdings
  the largest or smallest by weight), show_columns keeps the named fields (e.g.
  'Close,Volume' or 'Revenue,Net Income'; call once without it to see the names), and
  start_date/end_date or period narrow the range; an answer that is still too large is
  cut, with a note. sample='weekly' (or monthly, quarterly, yearly) keeps the last row of
  each period of a daily answer, after the indicator is calculated on daily data:
  window=200 with sample='weekly' gives the 200-day average once a week, where
  period='weekly' would make it a 200-week one; it applies before limit. rank=true turns
  a value per period and ticker (or country) into a ranking per period, from the highest
  (rank 1) to the lowest, with each one's gap to its neighbour (e.g. the worst return and
  how far it fell beyond the next worst); pick one field with show_columns where there
  are more. rebase_to='2020' (a year, month, day, a range such as '2019-2021' or
  '2020-01:2020-06') indexes each series to 100 at its average over that window, within
  the start_date/end_date fetched (an earlier window needs an earlier start_date); it is
  meant for levels such as prices and indices, not for returns or rates, and is skipped
  with growth=true or standardize=true. A table comes as {"columns": [...], "rows":
  [[...], ...]}, each row's values in the order of the columns. Read the _notes of an
  answer: they say what was left out, ignored or converted. The _sources of an answer name the publishers its data
  comes from (such as FinancialModelingPrep or the Bank for International Settlements);
  mention them when citing the figures. To find which tickers exist (by sector, country
  or exchange), use the Finance Database server.

