# ──────────────────────────────────────────────────────────────────────────────
# Category descriptions shown by the list_categories utility tool
# Keys must match the index_category (or module_name fallback) used when
# registering each router group below.
# ──────────────────────────────────────────────────────────────────────────────
category_descriptions:
  ratios:                  "Pre-computed financial ratios (PE, EPS, ROE, margins, liquidity, valuation). Use INSTEAD of raw financial statements."
  performance:             "Risk-adjusted returns (Sharpe, Sortino, alpha, beta, beta-implied return and residual, CAPM, Treynor, M2, tracking error, information ratio, Fama-French, Morningstar risk-adjusted return and risk, period/cumulative Returns and Excess Returns, Kelly criterion, trade statistics such as profit factor and payoff ratio). Most metrics support rolling= for a rolling-window value instead of one per period. No need to fetch price data first."
  risk:                    "Risk metrics (VaR incl. EVT/GPD tail fitting, CVaR, EVaR, GARCH, max drawdown, drawdown duration/recovery time, drawdown series and table, CDaR, tail ratio, skewness, kurtosis, downside deviation, Variance, Volatility, Excess Volatility). Most metrics support rolling= for a rolling-window value instead of one per period. No need to fetch price data first."
  econometrics:            "Statistical and econometric analysis of price or return series, or of any other indicator (series=): how unusual the latest value is (highest or lowest since) and how long it has been positive or negative (streaks), the change over the same months every year, of a series or the spread of two, unit root, cointegration and causality tests, VAR and ARIMA forecasts, regressions (OLS, quantile, IV, panel), causal designs (difference-in-differences, event study, synthetic control), Markov regime switching, structural breaks, time-varying beta, DCC-GARCH correlations, pairs trading and diagnostics. No need to fetch price data first."
  portfolio:               "Portfolio construction: optimal weights (minimum variance, maximum Sharpe, mean-variance, risk parity, HRP, HERC, NCO, minimum CVaR, minimum drawdown, maximum Omega and CVaR ratio, Black-Litterman, maximum diversification, minimum tracking error, growth optimal Kelly), efficient frontier, walk-forward backtest against 1/N, risk contributions (volatility, expected shortfall, semideviation, mean absolute deviation, CDaR), risk metrics of given weights, diversification metrics, whole-share discrete allocation, historical stress tests, look-through exposure of ETFs and Brinson attribution."
  portfolio_performance:   "A portfolio you hold, from its transactions, holdings, weights or a classic preset: positions, value and returns over time, returns per period, profit and loss per trade and the money-weighted return, next to a benchmark."
  models:                  "Financial models (DCF/intrinsic value, WACC, DuPont, Altman Z, Piotroski). Pre-computed."
  technicals:              "Technical indicators (RSI, MACD, Bollinger Bands, moving averages), candlestick patterns and trading signals. Applied to price data automatically."
  options:                 "Option pricing and Greeks (Black-Scholes, binomial, delta, gamma, theta, vega, implied vol)."
  etf:                     "ETF analysis (holdings, information, sector and country weightings, profile and premium/discount to NAV, tracking difference and error, concentration, overlap and active share between funds, look-through valuation of the holdings, liquidity, contribution of holdings and sectors to the return, return without some holdings or sectors)."
  government:              "Government fiscal metrics by country (debt, deficit, expenditure, revenue, tax, interest expenditure, expenditure by function such as defence, health and education). Use countries= param. Supports rolling= (moving-average) and trailing= (trailing-period sum)."
  macroeconomics:          "Macroeconomic indicators by country (GDP, real GDP, CPI, PPI, export and import prices, inflation, trade, investment, consumption, confidence, money supply, output gap, real interest rate, crisis indicators, commodity forward curves and term structure). Use countries= param (the commodity forward curve and term structure take commodity= instead, every commodity when left out). Supports rolling= (moving-average) and trailing= (trailing-period sum)."
  environment:             "Environmental and ESG data. Carbon footprint and renewable energy use countries= (supports rolling=/trailing=); ESG scores use tickers=."
  jobs:                    "Labour and social metrics by country (unemployment, population, poverty, income inequality). Use countries= param. Supports rolling= (moving-average) and trailing= (trailing-period sum)."
  rates:                   "Interest rate data — central bank rates, government/corporate bond yields, EURIBOR, short/long-term rates, U.S. Treasury par yield curve, real (TIPS) yield curve, breakeven inflation, zero-coupon curves, Nelson-Siegel-Svensson fits, yield curve principal components, Vasicek/CIR/Hull-White short-rate models, U.S. Treasury auction results. Use countries= param. Economics-sourced rates support rolling=/trailing=."
  fixed_income:            "Bond calculations on real bonds, from market prices (statistics, present value on the Treasury zero curve, duration, yield to maturity, Z-spread, key rate duration, Taylor price change next to the realised price change between two dates, Treasury bill bond-equivalent yields), rates from the market curves (forward rates, par yields, yield curve spreads, breakeven inflation), default probabilities implied by credit spreads, prices of every Treasury and thousands of corporate bonds, and mortgage payments, affordability and amortization at the US mortgage rate."
  discovery:               "Market discovery (lists of stocks, ETFs, indices, currencies and cryptocurrencies, stock screener, gainers and losers, sector and industry performance, Damodaran industry averages, earnings, IPO and split calendars, 8-K filings, insider trades, news, index constituents past and present). No tickers needed."
  market_data:             "Raw data (historical prices, financial statements, company profile, quotes, analyst estimates, price targets and recommendations, earnings calendar and call transcripts, insider statistics, institutional (13F) ownership, market risk premium, Commitment of Traders). Futures take Yahoo Finance tickers (BZ=F Brent, CL=F WTI, NG=F natural gas, GC=F gold, TTF=F Dutch gas): get_historical_data has the daily continuous front month of each (where Yahoo Finance has no daily bars, as for TTF=F, the days of the last two years are built from its hourly bars, closing at the last trade rather than the settlement), get_quote and get_intraday_data the commodities FinancialModelingPrep carries (not TTF=F). Use ratios/performance/risk tools for computed metrics."

# ──────────────────────────────────────────────────────────────────────────────
# Router group specifications
# Each entry becomes one MCP master tool.

tool_groups:
  # ── Ratios (5 sub-groups) ────────────────────────────────────────────────
  - tool_name:      "efficiency"
    display_name:   "Efficiency Ratios"
    description:    "Pre-computed efficiency ratios (asset turnover, inventory turnover, days sales outstanding, days payable outstanding, cash conversion cycle, capex intensity (capex/revenue), capex to depreciation, net capital expenditure (capex minus depreciation and amortization, the investment beyond what wears off), and the investment anomalies: asset growth (Cooper-Gulen-Schill, year over year on quarterly data) and net operating assets (Hirshleifer et al. NOA: operating assets minus operating liabilities over the total assets of the period before)). Requires tickers='AAPL' — use comma-separated values for multiple tickers. Use instead of raw financial statements. Supports quarterly=true and start_date/end_date. basket=true also adds up the tickers into one company, 'Total', whose ratios are calculated on the summed statements (e.g. the capex coverage of a group of companies together, not an average of their ratios); per-share ratios stay empty for it. For the predictive power of these ratios across tickers (factor analysis), use the valuation tool with indicator='get_factor_analysis' and metrics='efficiency'."
    module_name:    "ratios"
    category:       "ticker"
    basket:         true
    collect_method: "collect_efficiency_ratios"

  - tool_name:      "liquidity"
    display_name:   "Liquidity Ratios"
    description:    "Pre-computed liquidity ratios (current ratio, quick ratio, cash ratio, working capital). Requires tickers='AAPL' — use comma-separated values for multiple tickers. Use instead of raw financial statements. Supports quarterly=true and start_date/end_date. basket=true also adds up the tickers into one company, 'Total', whose ratios are calculated on the summed statements (e.g. the capex coverage of a group of companies together, not an average of their ratios); per-share ratios stay empty for it. For the predictive power of these ratios across tickers (factor analysis), use the valuation tool with indicator='get_factor_analysis' and metrics='liquidity'."
    module_name:    "ratios"
    category:       "ticker"
    basket:         true
    collect_method: "collect_liquidity_ratios"

  - tool_name:      "profitability"
    display_name:   "Profitability Ratios"
    description:    "Pre-computed profitability ratios (gross margin, operating margin, net margin, ROE, ROA, ROIC, ROCE, cash ROIC (CROIC), FCF conversion (FCF/net income, FCF/EBITDA), and the profitability factors: gross profitability (Novy-Marx GP/A), operating profitability (Fama-French RMW) and cash-based operating profitability (Ball et al.), and percent accruals (Hafzalla-Lundholm-Van Winkle: (net income - cash flow from operations) / |net income|)). Gross, operating and cash-based operating profitability and percent accruals use the trailing twelve months on quarterly data. Requires tickers='AAPL' — use comma-separated values for multiple tickers. Use instead of raw financial statements. Supports quarterly=true and start_date/end_date. basket=true also adds up the tickers into one company, 'Total', whose ratios are calculated on the summed statements (e.g. the capex coverage of a group of companies together, not an average of their ratios); per-share ratios stay empty for it. For the predictive power of these ratios across tickers (factor analysis), use the valuation tool with indicator='get_factor_analysis' and metrics='profitability'."
    module_name:    "ratios"
    category:       "ticker"
    basket:         true
    # Interest/Tax Burden are DuPont components that collect_profitability_ratios does not call,
    # but each is a standalone metric, so the full list is given explicitly here.
    # method_override replaces the discovered list wholesale, so anything added to
    # that collect_* method in future must be added here too.
    method_override:
      - "get_gross_margin"
      - "get_operating_margin"
      - "get_net_profit_margin"
      - "get_ebitda_margin"
      - "get_free_cash_flow_margin"
      - "get_interest_coverage_ratio"
      - "get_income_before_tax_profit_margin"
      - "get_effective_tax_rate"
      - "get_return_on_assets"
      - "get_cash_return_on_assets"
      - "get_return_on_equity"
      - "get_return_on_invested_capital"
      - "get_return_on_capital_employed"
      - "get_return_on_tangible_assets"
      - "get_income_quality_ratio"
      - "get_net_income_per_ebt"
      - "get_free_cash_flow_operating_cash_flow_ratio"
      - "get_EBT_to_EBIT"
      - "get_EBIT_to_revenue"
      - "get_cash_tax_rate"
      - "get_tax_rate_divergence"
      - "get_interest_burden_ratio"
      - "get_tax_burden_ratio"
      - "get_gross_profitability"
      - "get_operating_profitability"
      - "get_cash_based_operating_profitability"
      - "get_cash_return_on_invested_capital"
      - "get_free_cash_flow_conversion"
      - "get_free_cash_flow_to_ebitda_ratio"
      - "get_percent_accruals"

  - tool_name:      "solvency"
    display_name:   "Solvency Ratios"
    description:    "Pre-computed solvency ratios (debt-to-equity, interest coverage, debt-to-assets, net debt to EBITDA), the credit ratios of the rating agencies (EBITDA interest coverage, (EBITDA - CapEx) interest coverage, cash interest coverage, funds from operations (FFO) to debt and discretionary cash flow (DCF) to debt as defined by S&P Global Ratings) and the degrees of operating, financial and total leverage (DOL, DFL, DTL: the percentage change in operating income or net income per percentage change in revenue or operating income, year over year on quarterly data). FFO and DCF to debt use the trailing twelve months on quarterly data. Requires tickers='AAPL' — use comma-separated values for multiple tickers. Use instead of raw financial statements. Supports quarterly=true and start_date/end_date. basket=true also adds up the tickers into one company, 'Total', whose ratios are calculated on the summed statements (e.g. the capex coverage of a group of companies together, not an average of their ratios); per-share ratios stay empty for it. For the predictive power of these ratios across tickers (factor analysis), use the valuation tool with indicator='get_factor_analysis' and metrics='solvency'."
    module_name:    "ratios"
    category:       "ticker"
    basket:         true
    collect_method: "collect_solvency_ratios"

  - tool_name:      "valuation"
    display_name:   "Valuation Ratios"
    description:    "Pre-computed valuation ratios (P/E, EPS, EV/EBITDA, EV/EBIT, P/B, P/S, PEG, dividend yield, FCF yield, market cap, forward P/E, forward PEG, price to tangible book, EV to invested capital, FCF payout ratio, shareholder yield (the net payout yield: dividends plus buybacks minus issuance), and the issuance anomalies: net share issuance (Pontiff-Woodgate: log change in split-adjusted basic shares over a year), composite equity issuance (Daniel-Titman: log market cap growth minus log total return over five years) and net external financing (Bradshaw-Richardson-Sloan: equity and debt raised minus repurchases, repayments and dividends over average total assets, trailing twelve months on quarterly data)). Requires tickers='AAPL' — use comma-separated values for multiple tickers. Use instead of raw financial statements. Supports quarterly=true and start_date/end_date. basket=true adds up the tickers into one company, 'Total', whose ratios are calculated on the summed statements and the summed market cap (EV/EBITDA, FCF yield; per-share ratios such as P/E stay empty), so get_market_cap with basket=true adds a 'Total' of the tickers' market caps (share=true gives each ticker's share of it instead); show_daily=true gives the close of each day, e.g. limit=-1 for the latest. get_market_cap_to_gdp: the Buffett indicator of the tickers as one basket, their total market cap divided by the nominal GDP in US dollars of country= ('United States' by default, one country per call, e.g. country='China'), each date against the GDP of the last complete year; the tickers must be listed in US dollars. get_forward_price_earnings_ratio and get_forward_price_earnings_growth_ratio additionally require a Premium FMP subscription and are fetched on first use only; min_analysts= leaves out the periods whose EPS consensus has fewer analysts (market_data get_analyst_estimates shows the number per period). get_factor_analysis: factor analysis (predictive power) of the ratios across tickers: do the tickers that score high on one go on to return more than those that score low? Needs tickers= with at least ten, preferably twenty or more tickers. metrics= a ratio name, a comma-separated list, or a collection: 'valuation' (default: multiples, yields and market cap), 'profitability', 'solvency', 'liquidity', 'efficiency' or 'all'. Returns a row per metric and horizon: the mean information coefficient (IC, the Spearman rank correlation between the metric and the later returns), its standard deviation, IC information ratio, t-statistic, p-value, share of positive periods, number of periods, the Top Minus Bottom quantile spread, quantile turnover and rank autocorrelation. detail='information_coefficient', 'quantile_returns', 'quantile_turnover' or 'rank_autocorrelation' returns that part per period (or per quantile) for a single metric. period= sets how often it is evaluated (monthly by default), horizons= the periods ahead (e.g. 12 or [1, 12]), quantiles= the number of quantiles (5). Other parameters (e.g. trailing=) pass to the ratios. The IC is reported as measured: a negative IC means low values go on to outperform, as for a low P/E. Statement figures apply from the fiscal period end, so there is no look-ahead."
    module_name:    "ratios"
    category:       "ticker"
