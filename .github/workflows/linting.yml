name: General Linting

on:
  pull_request:
    types: [opened, synchronize, edited]
  push:
    branches:
      - 'main'
      - 'develop'

permissions:
  contents: read

jobs:
  code-linting:
    name: General Code Linting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - run: uv run black --diff --check financetoolkit tests
      - run: uv run ruff check financetoolkit tests
      - run: uv run codespell financetoolkit tests
      - run: uv check --preview-features check-command

  markdown-link-check:
    name: Markdown Linting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Check out the code
      - name: Lint Code Base
        uses: docker://avtodev/markdown-lint@sha256:6aeedc2f49138ce7a1cd0adffc1b1c0321b841dc2102408967d9301c031949ee # v1