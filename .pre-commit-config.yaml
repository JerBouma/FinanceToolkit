repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
        exclude_types: [css, markdown, text, svg]
      - id: trailing-whitespace
        exclude_types: [html, markdown, text]
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: python
        types: [python]
        args: ["--config", "pyproject.toml"]
        additional_dependencies: ["black[jupyter]>=26.3.1"]
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check
        language: python
        types: [python]
        args: ["--config=pyproject.toml"]
        additional_dependencies: ["ruff>=0.13.2"]
  - repo: local
    hooks:
      - id: codespell
        name: codespell
        entry: codespell
        language: python
        types: [text]
        exclude: '\.ipynb$'
        # Passed explicitly: codespell only auto-discovers pyproject.toml when it
        # can import a TOML reader, and silently ignores the whole [tool.codespell]
        # section when it cannot.
        args: ["--toml", "pyproject.toml"]
        additional_dependencies: ["codespell[toml]>=2.4"]