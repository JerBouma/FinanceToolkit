# ──────────────────────────────────────────────────────────────────────────────
# Finance Toolkit MCP Server — Configuration
#
# All module-level constants for the MCP server live here.
# Edit this file to add/remove tools, adjust defaults, or tune behaviour
# without touching Python source code.  Comments explain every key.
# ──────────────────────────────────────────────────────────────────────────────

# ──────────────────────────────────────────────────────────────────────────────
# Category identifiers
# These strings are used internally to route MCP tool calls to the correct
# dispatch path in provider_model.py:
#   ticker     — sub-module accessed via a Toolkit instance (needs tickers=)
#   toolkit    — method called directly on a Toolkit instance (needs tickers=)
#   standalone — module instantiated with countries/dates only (no tickers)
#   discovery  — Discovery controller; no tickers, no date range
#   portfolio  — a Portfolio built from transactions, weights, holdings or a preset
#   mixed      — spans multiple modules / categories; per-indicator routing
# ──────────────────────────────────────────────────────────────────────────────
categories:
  ticker:     "ticker"
  toolkit:    "toolkit"
  standalone: "standalone"
  discovery:  "discovery"
  portfolio:  "portfolio"
  mixed:      "mixed"


# ──────────────────────────────────────────────────────────────────────────────
# SQLite result-cache defaults
# The database is always stored next to the global Finance Toolkit .env file:
#   macOS / Linux  — $XDG_CONFIG_HOME/financetoolkit/financetoolkit_cache.db
#                    (falls back to ~/.config/financetoolkit/financetoolkit_cache.db)
#   Windows        — %APPDATA%\financetoolkit\financetoolkit_cache.db
# The path can be overridden at runtime with:
#   FINANCE_TOOLKIT_CACHE_DB       — absolute path to the SQLite file
#   FINANCE_TOOLKIT_CACHE_TTL      — TTL in seconds (integer)
#   FINANCE_TOOLKIT_CACHE_ENABLED  — true/false, overrides the "auto" below
#
# enabled is one of "full", "shared", "off" (or true/false for full/off) or "auto":
#   full    everything: the source data and the tool responses (ttl_seconds).
#   shared  the source data of every source except FinancialModelingPrep, and no
#           tool responses.
#   off     nothing; every request is fetched live.
# "auto" means full for a local server (stdio transport, one user, one machine)
# and shared for a hosted one (MCP_TRANSPORT=sse or streamable-http). A hosted
# server serves every user from one process against one database. Its users share
# the official statistics, Yahoo Finance and the other public sources, while
# FinancialModelingPrep data belongs to each subscriber and is always retrieved
# with the user's own key. A tool response is not shared, since it may be
# calculated from FinancialModelingPrep data.
# ──────────────────────────────────────────────────────────────────────────────
cache:
  enabled: auto
  ttl_seconds: 600

# ──────────────────────────────────────────────────────────────────────────────
# Response size
# A response larger than this many characters (about four per token) is cut to its
# most recent rows, or its first columns, with a note on how to narrow the request,
# so a broad question cannot flood the client's context. FT_MCP_MAX_RESPONSE_CHARACTERS
# overrides it; 0 switches the limit off.
# ──────────────────────────────────────────────────────────────────────────────
responses:
  max_characters: 60000

# ──────────────────────────────────────────────────────────────────────────────
# Size limits
# The parameters that decide how much a call simulates, computes or downloads are
# capped, so one call cannot take the memory of a server others share. The Python
# methods keep their own, wider limits.
# maximums caps a value (every value of a list); products caps parameters that are
# computed together (simulated paths times their steps), with the indicator's own
# default for a parameter the caller left out. A call over a limit is refused with
# the limit, before anything is collected.
# ──────────────────────────────────────────────────────────────────────────────
parameter_limits:
  maximums:
    # Every simulated draw is a row of the answer, with a column per ticker.
    n_simulations: 10000
    # Monte Carlo valuations and option prices (paths per ticker and expiration).
    simulations: 100000
    # Monte Carlo steps per path and GARCH forecast horizons.
    time_steps: 1000
    # A binomial tree per strike has (timesteps + 1)² nodes.
    timesteps: 50
    # Short rate simulations; see products for their combined size.
    paths: 10000
    steps_per_year: 52
    years: 50
    # Option grids have a value per strike and expiration day.
    strike_price_range: 0.5
    expiration_time_range: 366
    number_of_strikes: 1000
    # Each expiration, holding, page, contract or day is a download of its own.
    number_of_expirations: 24
    holdings: 500
    pages: 10
    contracts: 36
    history_days: 366
    limit: 10000
    # Resampling, optimization and model orders, each a fit or a loop of its own.
    n_bootstrap: 1000
    # Michaud resampling solves an optimization per resample: about 0.1 s each for 50
    # tickers of daily returns, so 1,000 resamples take about 100 s.
    resamples: 1000
    # Two years of daily returns per estimate of a walk-forward backtest; minimum CVaR,
    # minimum drawdown and the Omega and CVaR ratio optimizers solve a linear programme
    # with variables per day of the lookback at every rebalancing. 50 tickers over 21
    # years, monthly, with all thirteen methods take about 95 s with a lookback of 252
    # days, 140 s with 504 and 210 s with 756.
    lookback: 504
    points: 100
    # A discrete allocation counts whole shares; beyond this value the share counts
    # outgrow the precision of the integer programme.
    portfolio_value: 10000000000
    max_breaks: 10
    regimes: 5
    forecast_steps: 365
    periods: 100
    project_periods: 100
    high_growth_periods: 100
    transition_periods: 100
    lags: 100
    max_lag: 100
    maxlags: 100
    k_ar_diff: 20
    p: 10
    d: 2
    q: 10
    power: 5
  products:
    # 10,000 paths of 100 steps per expiration by default.
    - parameters: [simulations, time_steps]
      maximum: 5000000
    # 10,000 paths of ten years of monthly steps by default.
    - parameters: [paths, steps_per_year, years]
      maximum: 5000000

# ──────────────────────────────────────────────────────────────────────────────
# Hosted server limits
# A hosted server (MCP_TRANSPORT=sse or streamable-http) shares its work slots among
# everyone. A call is answered with a timeout after call_timeout_seconds, and each
# user (an API key) has at most calls_per_user calls running at a time; a further
# call is refused until one of them finishes. A local server has neither limit.
# ──────────────────────────────────────────────────────────────────────────────
hosted_limits:
  call_timeout_seconds: 180
  calls_per_user: 3

# ──────────────────────────────────────────────────────────────────────────────
# Server instructions
# Sent to the client once when it connects, so an agent knows how to find an
# indicator and how to read and narrow the answers before its first call.
# ──────────────────────────────────────────────────────────────────────────────
instructions: >-
  The Finance Toolkit calculates financial data with about 500 indicators: prices and
  financial statements, ratios, valuation and risk models, performance, technical
  indicators, options and bonds, econometrics and macroeconomic data by country. Each tool groups indicators of
  one kind; pass the indicator by name (e.g. valuation with
  indicator='get_price_to_earnings_ratio'). When unsure which indicator or tool fits,
  call search_metrics with what you want to measure. Company tools take tickers (e.g.
  'AAPL,ASML.AS'); country tools take countries (e.g. 'United States,Germany'). Rates,
  ratios and returns are decimal fractions (0.05 is 5%), and a 'Benchmark' entry is the
  benchmark ticker (SPY unless benchmark_ticker says otherwise). Keep answers small:
  limit=-5 gives the last five periods (5 the first five), show_columns keeps the named
  fields, and start_date/end_date or period narrow the range; an answer that is still
  too large is cut, with a note. rank=true turns a value per period and ticker (or
  country) into a ranking per period, with each one's gap to its neighbour (e.g. the
  worst return and how far it fell beyond the next worst). Read the _notes of an answer: they say what was left
  out, ignored or converted. The _sources of an answer name the publishers its data
  comes from (such as FinancialModelingPrep or the Bank for International
  Settlements); mention them when citing the figures. To find which tickers exist (by
  sector, country or exchange), use the Finance Database server.

# ──────────────────────────────────────────────────────────────────────────────
# Module → Python class mapping
# Keys are short logical names used throughout the server.
# Values are fully-qualified class paths used for dynamic loading.
# ──────────────────────────────────────────────────────────────────────────────
module_class_map:
  ratios:       "financetoolkit.ratios.ratios_controller.Ratios"
  technicals:   "financetoolkit.technicals.technicals_controller.Technicals"
  models:       "financetoolkit.models.models_controller.Models"
  performance:  "financetoolkit.performance.performance_controller.Performance"
  risk:         "financetoolkit.risk.risk_controller.Risk"
  econometrics: "financetoolkit.econometrics.econometrics_controller.Econometrics"
  portfolio:    "financetoolkit.portfolio.construction_controller.PortfolioConstruction"
  portfolio_performance: "financetoolkit.portfolio.portfolio_controller.Portfolio"
  options:      "financetoolkit.options.options_controller.Options"
  etf:          "financetoolkit.etf.etf_controller.ETF"
  economics:    "financetoolkit.economics.economics_controller.Economics"
  fixedincome:  "financetoolkit.fixedincome.fixedincome_controller.FixedIncome"
  discovery:    "financetoolkit.discovery.discovery_controller.Discovery"
  toolkit:      "financetoolkit.toolkit_controller.Toolkit"

# ──────────────────────────────────────────────────────────────────────────────
# Methods to skip during class inspection
# Method discovery only picks up get_* names, so the aggregate collect_* helpers are
# never exposed as indicators. get_normalization_files is skipped since it is purely
# meant for your own data sources and not relevant for users of the MCP tools.
#
# Discovery's search_* methods are not reachable either, for the same reason. That is
# deliberate: looking up instruments is left to the Finance Database MCP server, so the
# two servers do not overlap, and the search_*_news methods duplicate the get_*_news
# ones with a ticker filter the LLM can apply itself.
# ──────────────────────────────────────────────────────────────────────────────
skip_methods:
  - "get_normalization_files"
  # EGARCH fits take around 45 seconds per ticker (a deterministic multi-start search),
  # longer than an assistant waits for a tool; GARCH and GJR-GARCH remain available.
  - "get_egarch"
  - "get_egarch_forecast"
  - "get_egarch_parameters"

# ──────────────────────────────────────────────────────────────────────────────
# Parameters removed from individual method signatures during inspection
# These serve little purpose for the user given most will appear in the logs only
# ──────────────────────────────────────────────────────────────────────────────
skip_params:
  - "self"
  - "progress_bar"
  - "overwrite"
  - "rounding"

# ──────────────────────────────────────────────────────────────────────────────
# Parameters handled at wrapper level (not forwarded to sub-methods)
# tickers, countries, start_date, end_date, quarterly are extracted from kwargs
# by the wrapper and passed to the provider, not to individual method calls.
# ──────────────────────────────────────────────────────────────────────────────
init_handled_params:
  - "tickers"
  - "countries"
  - "start_date"
  - "end_date"
  - "quarterly"
  - "benchmark_ticker"
  - "show_columns"

