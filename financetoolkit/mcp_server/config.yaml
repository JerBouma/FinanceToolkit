  # ── Single-module ticker tools ───────────────────────────────────────────
  - tool_name:    "models"
    display_name: "Financial Models"
    description:  "Financial models of companies from their statements and prices: WACC, DuPont and Nissim-Penman decompositions, enterprise value breakdown, valuation (DCF and its history, reverse and Monte Carlo DCF, Gordon growth, H-model, two-stage dividend discount, earnings power value, justified multiples, Graham number and intrinsic value, EVA, PVGO, implied cost of capital, peer comparison), distress and credit (Altman Z with its original, private, non-manufacturing and emerging models, Ohlson O, Zmijewski, Springate, Grover, Fulmer, Taffler, Merton distance to default, Campbell-Hilscher-Szilagyi, Shumway, synthetic credit rating), quality and manipulation scores (Piotroski F, Beneish M, Dechow F, Montier C, Mohanram G, Quality Minus Junk, accruals, Graham criteria, magic formula), financial constraints (KZ, WW, SA), growth and capital (sustainable, internal and fundamental growth, ROIIC, unlevered beta, capitalized R&D, CFROI, owner earnings, rule of 40) and return decomposition. The valuation models need no inputs: the discount rates default to each company's cost of equity or WACC and the growth to its own history; rate_of_return=, growth_rate= and the like override them, as one number or per ticker ({'AAPL': 0.08}). The scores that rank tickers against each other (magic formula, Mohanram G, quality score, Whited-Wu) need the peers in tickers=. Requires tickers='AAPL,MSFT'; quarterly=true for quarterly data and start_date/end_date for the range. basket=true adds a 'Total': the tickers as one company, its ratios calculated on the summed statements (per-share ratios stay empty). get_factor_analysis measures the predictive power of the models across ten or more tickers (metrics='scores' by default, or 'all'). Some need history before start_date: get_capitalized_research_and_development (amortization_years), get_accrual_quality (10 years) and get_discretionary_accruals (12 years). get_graham_intrinsic_value needs a FRED API key unless bond_yield= is given; get_implied_cost_of_capital needs a Premium FMP subscription. On quarterly data the distress scores use a trailing year (trailing=1 for single quarters). search_metrics with an indicator's name gives its parameters, options and defaults."
    module_name:  "models"
    category:     "ticker"
    basket:       true
    risk_free_rate: true

  - tool_name:    "performance"
    display_name: "Performance Metrics"
    description:  "Risk-adjusted performance of tickers against the benchmark: returns (cumulative, log, excess, trailing, calendar), Sharpe ratio (standard, smart, Lo, adjusted, probabilistic, deflated; its standard error, difference test and minimum track record length), Sortino, Calmar, Sterling, Burke, Treynor, M2, Omega, information ratio, tracking error, alpha and beta (also Blume, Vasicek, Dimson, bull and bear), CAPM, capture ratios, win rate, Kelly criterion, return statistics, Fama-French and Carhart factor models (region= for Ken French's regional factors), style analysis, beta-implied returns ('the largest stock-specific fall since'), bootstrap statistics, forecast cone, backtest overfitting and more. Requires tickers='AAPL,MSFT'. Results are per period (weekly, monthly, quarterly or yearly); period='daily' needs rolling=N (e.g. rolling=60) except for the indicators that are daily by default. rolling=N gives a rolling N-period value over the full history. Sharpe, Sortino and similar ratios are per observation (per day within the period) unless annualize=true. Returns start from the first close on or after start_date: for a year-to-date return set start_date to the last trading day of the previous year. get_factor_analysis measures the predictive power of the metrics across ten or more tickers. method='lo' needs 30 or more returns per period; get_beta_implied_return needs start_date two or more years back. search_metrics with an indicator's name gives its parameters, options and defaults."
    module_name:  "performance"
    category:     "ticker"
    risk_free_rate: true

  - tool_name:    "risk"
    display_name: "Risk Metrics"
    description:  "Risk measures of tickers' returns: VaR and CVaR (historic, gaussian, Cornish-Fisher, Student-t, EVT, kernel and GARCH; spectral CVaR), EVaR, entropic risk, VaR backtests (Kupiec, Christoffersen and more; Acerbi-Szekely for the CVaR), GARCH models (get_garch, forecasts, parameters, news impact, simulation; EGARCH, AVGARCH and realized GARCH are not available on this server), drawdowns (maximum, duration, recovery, series, table, statistics, DaR, CDaR, EDaR, Ulcer and Pain index), skewness, kurtosis, downside and upside deviation, partial, central and L-moments, Gini and tail measures, volatility estimators (Parkinson, Garman-Klass, Yang-Zhang and more), excess and idiosyncratic volatility, memory and chaos measures (Hurst, fractal dimension, Lyapunov), copulas and tail dependence, systemic risk (CoVaR, MES, SRISK, against the benchmark or market_ticker=) and market liquidity (Amihud, price impact, Roll and bid-ask spreads, turnover, VPIN). VaR, CVaR, drawdowns and worst realizations are returns, negative for a loss. Requires tickers='AAPL,MSFT'. period='daily' gives a value over the whole range; weekly, monthly, quarterly or yearly a value per period, and rolling=N a rolling value over the full history. get_factor_analysis measures the predictive power of risk metrics across ten or more tickers (a negative IC for volatility is the low-volatility anomaly). How unusual a move is: the econometrics tool's get_move_significance. get_srisk is meant for financial firms; get_vpin is daily (limit=-1 for the latest). search_metrics with an indicator's name gives its parameters, options and defaults."
    module_name:  "risk"
    category:     "ticker"
    risk_free_rate: true

  - tool_name:    "econometrics"
    display_name: "Econometrics Tests"
    description:  "Statistics and econometrics of price or return series: unit root, stationarity and bubble tests, fractional differencing, cointegration, Granger causality, VAR, VECM and ARIMA forecasts, regressions (OLS, WLS, GLS, quantile, logit/probit, IV, Fama-MacBeth, panels), causal designs (difference-in-differences, event study, regression discontinuity, synthetic control, matching), diagnostics, forecast comparison and tests, rolling statistics, entropy, regimes and breaks, pairs trading, and how unusual a value or move is: get_move_significance ('the biggest fall since'), get_level_significance (percentile, highest since, change since start_date, largest drawdown) and get_streaks. Requires tickers='AAPL,MSFT', or series= to analyze the indicators of other tools instead: references separated by ';', each tool:indicator:tickers-or-countries with an optional :column, e.g. 'macroeconomics:get_inflation_rate:United States' or 'rates:get_government_bond_yield_curve:United States:10Y'; each becomes a series named after its ticker or country, which dependent_ticker and independent_tickers name. changes='difference' suits rates. get_move_significance needs start_date a year or more back, and the answer of get_level_significance depends on start_date. spread_over= measures every series minus one of them. search_metrics with an indicator's name gives its parameters, options and defaults."
    module_name:  "econometrics"
    category:     "ticker"
    basket:       true

  - tool_name:    "etf"
    display_name: "ETF Analysis"
    description:  "ETFs and other funds: holdings (the 25 largest by weight unless limit= says otherwise), sector and country weightings, information, profile (expense ratio, assets, NAV, premium or discount), tracking against benchmark_ticker (the fund's index or another fund of it), concentration, overlap and active share between funds, look-through valuation, liquidity, the contribution of each holding or sector to the return and the return without some holdings (exclude=). Requires tickers='VOO,QQQ'; tickers that are not a fund return no data. The holdings carry no sector or country: use the weightings or the Finance Database server. get_contribution and get_return_excluding price the holdings one request each (holdings= limits that). search_metrics with an indicator's name gives its parameters, options and defaults."
    module_name:  "etf"
    category:     "ticker"

  - tool_name:    "portfolio"
    display_name: "Portfolio Construction"
    description:  "Portfolio construction for two or more tickers: optimal weights (minimum variance, maximum Sharpe, mean-variance, risk parity, hierarchical risk parity, HERC, NCO, Schur, inverse volatility, maximum diversification, maximum Omega, mean-risk with CVaR, CDaR and drawdowns, worst-case and distributionally robust, Black-Litterman, minimum tracking error, growth optimal, resampled, stacking, critical line), the efficient frontier and a walk-forward backtest of the optimizers; for given weights (weights={'AAPL': 0.6, 'MSFT': 0.4}, equal when omitted): risk and factor risk contributions, factor and Brinson attribution, risk metrics, stress tests, look-through exposure, diversification and a discrete allocation in whole shares; and the estimates behind them (expected returns, covariance, codependence, clusters, co-moments, entropy pooling, factor loadings, estimation uncertainty). The optimizers take bounds (minimum_weight=, maximum_weight=, sector_bounds=, country_bounds=), net_exposure= and gross_exposure= for long-short, current_weights= with maximum_turnover=, expected_returns= and covariance= estimators. Weights, returns and volatilities are annualized decimals. To follow a portfolio held over time, use portfolio_performance. search_metrics with an indicator's name gives its parameters, options and defaults."
    module_name:  "portfolio"
    category:     "ticker"
    risk_free_rate: true

  - tool_name:    "portfolio_performance"
    display_name: "Portfolio Performance"
    description:  "The value and returns of a portfolio over time, built from one of: transactions (a list of trades), holdings ({'AAPL': 10, 'MSFT': 5}), weights ({'VTI': 0.6, 'BND': 0.4}, invested on start_date and rebalanced as rebalancing= says) or preset (a classic portfolio such as '60/40' or 'All Weather'; get_presets lists them). It gives the overview per position, the performance per period, positions per day, transactions and their results, the money-weighted return (XIRR), return contributions, turnover, gross leverage, round-trip trades with their statistics (win rate, profit factor, expectancy) and position timing. Prices are valued in one currency (currency=). Returns, weights and rates are decimals. search_metrics with an indicator's name gives its parameters, options and defaults."
    module_name:  "portfolio_performance"
    category:     "portfolio"
    method_override:
      - "get_portfolio_overview"
      - "get_portfolio_performance"
      - "get_positions_overview"
      - "get_transactions_overview"
      - "get_transactions_performance"
      - "get_money_weighted_return"
      - "get_return_contributions"
      - "get_turnover"
      - "get_gross_leverage"
      - "get_trades"
      - "get_trade_statistics"
      - "get_position_timing"
      - "get_presets"

  - tool_name:    "options"
    display_name: "Options"
    description:  "Options on tickers, from live chains and prices: European, American (listed stock options are American: get_american_option), binomial, Black-76, CEV, Heston-Nandi, Monte Carlo and exotic option prices (Asian, barrier, lookback, touch, chooser, forward-start and cliquet, exchange and spread options), Greeks, implied volatility, volatility surfaces (SVI, SSVI, SABR, local volatility), Heston calibration, stock price simulation, delta hedging backtests and simulations, strategy payoffs (legs=), option chains and market metrics per expiry (put/call ratio, max pain, term structure, skew, implied move, risk-neutral moments, variance swap) and per ticker (gamma exposure, model-free implied volatility as the VIX, skew index, volatility risk premium). Requires tickers='AAPL,MSFT'. Option grids cover the strikes within 5% of the price unless strike_price_range= asks for more. The market metrics read the live chain, so leave end_date at today. days= cannot exceed the longest listed expiry; the Heston calibration uses expiries at least 14 days away. search_metrics with an indicator's name gives its parameters, options and defaults."
    module_name:  "options"
    category:     "ticker"

