name: General Linting

on:
  pull_request:
    types: [opened, synchronize, edited]
  push:
    branches:
      - 'main'
      - 'develop'

permissions:
  contents: read

jobs:
  code-linting:
    name: General Code Linting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - run: uv run black --diff --check financetoolkit tests
      - run: uv run ruff check financetoolkit tests
      - run: uv run codespell financetoolkit tests
      - run: uv check --preview-features check-command

  markdown-link-check:
    name: Markdown Linting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        name: Check out the code
      - name: Lint Code Base
        uses: docker://avtodev/markdown-lint@sha256:6aeedc2f49138ce7a1cd0adffc1b1c0321b841dc2102408967d9301c031949ee # v1