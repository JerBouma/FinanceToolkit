  - tool_name:      "liquidity"
    display_name:   "Liquidity Ratios"
    description:    "Liquidity ratios from the financial statements: current, quick and cash ratio, working capital, operating cash flow ratio and short term coverage (trailing twelve months on quarterly data). Requires tickers='AAPL,MSFT'; quarterly=true for quarterly data and start_date/end_date for the range. basket=true adds a 'Total': the tickers as one company, its ratios calculated on the summed statements (per-share ratios stay empty). Factor analysis of these ratios: the valuation tool with indicator='get_factor_analysis' and metrics='liquidity'. search_metrics with an indicator's name gives its parameters, options and defaults."
    module_name:    "ratios"
    category:       "ticker"
    basket:         true
    collect_method: "collect_liquidity_ratios"

  - tool_name:      "profitability"
    display_name:   "Profitability Ratios"
    description:    "Profitability ratios from the financial statements: gross, operating, net, EBITDA, free cash flow and pre-tax margins, ROE, ROA, operating and cash ROA, ROIC, ROCE, cash ROIC, return on tangible assets, effective and cash tax rates, interest coverage, income quality, FCF conversion, the DuPont burdens, the profitability factors (Novy-Marx gross profitability, Fama-French operating profitability, cash-based operating profitability, percent accruals) and the Nissim-Penman ratios (RNOA, net borrowing cost, financial leverage). Requires tickers='AAPL,MSFT'; quarterly=true for quarterly data and start_date/end_date for the range. basket=true adds a 'Total': the tickers as one company, its ratios calculated on the summed statements (per-share ratios stay empty). Factor analysis of these ratios: the valuation tool with indicator='get_factor_analysis' and metrics='profitability'. search_metrics with an indicator's name gives its parameters, options and defaults."
    module_name:    "ratios"
    category:       "ticker"
    basket:         true
    # Interest/Tax Burden are DuPont components that collect_profitability_ratios does not call,
    # but each is a standalone metric, so the full list is given explicitly here.
