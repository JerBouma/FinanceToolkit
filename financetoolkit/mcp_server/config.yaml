  - tool_name:      "solvency"
    display_name:   "Solvency Ratios"
    description:    "Solvency ratios from the financial statements: debt to equity, assets, capital, EBITDA and market cap, long-term debt to capitalization, net debt to EBITDA and equity, interest and cash flow coverage, the solvency ratio, the credit ratios of the rating agencies (EBITDA interest coverage, FFO and discretionary cash flow to debt) and the degrees of operating, financial and total leverage. Requires tickers='AAPL,MSFT'; quarterly=true for quarterly data and start_date/end_date for the range. basket=true adds a 'Total': the tickers as one company, its ratios calculated on the summed statements (per-share ratios stay empty). Factor analysis of these ratios: the valuation tool with indicator='get_factor_analysis' and metrics='solvency'. search_metrics with an indicator's name gives its parameters, options and defaults."
    module_name:    "ratios"
    category:       "ticker"
    basket:         true
    collect_method: "collect_solvency_ratios"

  - tool_name:      "valuation"
    display_name:   "Valuation Ratios"
    description:    "Valuation ratios: P/E, forward P/E, CAPE, PEG and PEGY, P/B, P/S, P/CF, P/FCF, price to tangible book, EV and EV/EBITDA, EV/EBIT, EV/sales, EV/FCF, EV to invested capital, earnings, dividend, buyback and shareholder yields (the FCF yield is in the solvency tool), payout and retention ratios, per-share figures (EPS, book value, cash flow, cash, Graham's net-net working capital), market cap and market cap to GDP (the Buffett indicator), and the issuance anomalies (net share issuance, composite equity issuance, net external financing). Requires tickers='AAPL,MSFT'; quarterly=true for quarterly data and start_date/end_date for the range. basket=true adds a 'Total': the tickers as one company, its ratios calculated on the summed statements (per-share ratios stay empty). show_daily=true gives a value per trading day (limit=-1 for the latest). The forward ratios need a Premium FMP subscription. get_factor_analysis measures the predictive power of ratios across ten or more tickers (twenty or more is better): the information coefficient (IC) per metric and horizon, metrics= a ratio, a list or 'valuation' (default), 'profitability', 'solvency', 'liquidity', 'efficiency' or 'all'; a negative IC means low values go on to outperform, as for a low P/E. The CAPE needs start_date years= (10) years before the first value; get_market_cap_to_gdp takes tickers listed in US dollars and one country=. get_quote's market cap uses the current shares, get_market_cap the diluted shares of the latest fiscal period. search_metrics with an indicator's name gives its parameters, options and defaults."
    module_name:    "ratios"
