# JUDGEMENT: 85/15 keeps the risky end at the top of his range, since small-cap and growth stocks are far tamer than options.
name: Barbell
aliases: ["Taleb", "Antifragile"]
description: "Nassim Taleb's barbell: 85% Treasury bills and 15% small-cap and growth stocks, nothing in between."
source:
  text: "Taleb (2007), The Black Swan: 85-90% in extremely safe instruments such as Treasury bills and the remaining 10-15% in highly leveraged speculative bets such as options (page not verified)."
